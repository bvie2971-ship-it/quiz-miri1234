* { box-sizing: border-box }

 no?"], "j": "Standard phone phrase.", "fr": "Voulez-vous laisser un message ?", "id": 37}, {"c": "c", "l": "B1", "q": "The phone line is bad. You say:", "o": ["Sorry, you're breaking up. Could you repeat that?", "Your phone is broken.", "I don't hear you, stop.", "Speak louder, now!"], "j": "\"You're breaking up\" = the line is bad.", "fr": "La ligne coupe.", "id": 38}, {"c": "c", "l": "B1", "q": "To ask someone to wait on the phone:", "o": ["Could you hold on a moment, please?", "Wait me.", "Stay here.", "Hold the phone, now."], "j": "\"Hold on\" = wait (on the phone).", "fr": "Ne quittez pas.", "id": 39}, {"c": "c", "l": "B1", "q": "To end a phone call politely:", "o": ["Thanks for calling. Have a nice day.", "OK, finished. Bye.", "Stop now.", "That's all, go."], "j": "Polite closing.", "fr": "Clore poliment un appel.", "id": 40}, {"c": "c", "l": "B1", "q": "Which sentence is best to start a cover letter?", "o": ["I am writing to apply for the position of sales assistant.", "I want this job very much please.", "Hello, give me the job.", "I write you for job."], "j": "Formal opening: \"I am writing to apply for…\".", "fr": "Début de lettre de motivation.", "id": 41}, {"c": "c", "l": "B1", "q": "In a formal email, which phrase introduces an attachment?", "o": ["Please find attached my CV.", "Look at the thing I put.", "Here is CV, see it.", "I attach you my CV."], "j": "Standard phrase: \"Please find attached…\".", "fr": "Veuillez trouver ci-joint…", "id": 42}, {"c": "c", "l": "B1", "q": "You want to ask for information in a formal email:", "o": ["I would be grateful if you could send me more information.", "Send me info fast.", "Give information please now.", "I want informations."], "j": "\"I would be grateful if you could…\" is very polite.", "fr": "Je vous serais reconnaissant(e) de…", "id": 43}, {"c": "c", "l": "B1", "q": "To end a formal email asking for a reply:", "o": ["I look forward to hearing from you.", "Answer me quickly.", "Write back fast please.", "I wait your answer."], "j": "Standard formal closing line.", "fr": "Dans l'attente de votre réponse.", "id": 44}, {"c": "c", "l": "B1", "q": "You start a formal email with \"Dear Mr Jones\". You should end with:", "o": ["Yours sincerely,", "Yours faithfully,", "Love,", "Cheers,"], "j": "UK rule: name known → Yours sincerely; name unknown → Yours faithfully.", "fr": "Nom connu → Yours sincerely.", "id": 45}, {"c": "c", "l": "B1", "q": "An informal email to a friend could start with:", "o": ["Hi Sam,", "Dear Sir,", "To whom it may concern,", "Dear Madam,"], "j": "\"Hi + name\" is informal.", "fr": "Début informel.", "id": 46}, {"c": "c", "l": "B1", "q": "To follow up on an email with no answer:", "o": ["I'm just following up on my previous email.", "Why you don't answer?", "You forgot me?", "Answer now please."], "j": "\"Follow up\" = contact again politely.", "fr": "relancer.", "id": 47}, {"c": "c", "l": "B1", "q": "To apologise for a late reply in an email:", "o": ["Apologies for the delayed response.", "Sorry, I was lazy.", "I reply late, so what.", "Late answer, sorry you."], "j": "Professional apology.", "fr": "Désolé(e) pour ma réponse tardive.", "id": 48}, {"c": "c", "l": "B1", "q": "To confirm a meeting by email:", "o": ["I'm writing to confirm our meeting on Tuesday at 10 a.m.", "Meeting Tuesday OK?", "We see Tuesday maybe.", "Tuesday, 10, come."], "j": "Clear and polite confirmation.", "fr": "Confirmer un rendez-vous.", "id": 49}, {"c": "c", "l": "B1", "q": "To suggest a new time for a meeting:", "o": ["Would Thursday at 3 p.m. suit you instead?", "Thursday is better, come.", "Change to Thursday.", "You must come Thursday."], "j": "\"Would … suit you?\" is a polite suggestion.", "fr": "Est-ce que jeudi vous conviendrait ?", "id": 50}, {"c": "c", "l": "B1", "q": "At the start of a meeting, the chair says:", "o": ["Shall we get started?", "Start now, everyone!", "Begin, please you.", "Go, go, go!"], "j": "\"Shall we get started?\" is a polite way to begin.", "fr": "On commence ?", "id": 51}, {"c": "c", "l": "B1", "q": "To give your opinion in a meeting:", "o": ["In my opinion, we should reduce costs.", "My opinion is: reduce.", "I am opinion that…", "According to me, reduce."], "j": "\"In my opinion…\" / \"I think…\". \"According to me\" is not natural.", "fr": "Évitez « according to me ».", "id": 52}, {"c": "c", "l": "B1", "q": "To agree strongly:", "o": ["I couldn't agree more.", "I could agree more.", "I'm agree.", "I am agreeing you."], "j": "\"I couldn't agree more\" = I completely agree. Note: \"I agree\", never \"I'm agree\".", "fr": "I agree (pas « I'm agree »).", "id": 53}, {"c": "c", "l": "B1", "q": "To partly agree:", "o": ["I agree up to a point, but…", "I agree totally not.", "I'm agree half.", "Yes and no and yes."], "j": "\"Up to a point\" = partly.", "fr": "Je suis d'accord jusqu'à un certain point.", "id": 54}, {"c": "c", "l": "B1", "q": "To ask someone to explain more:", "o": ["Could you elaborate on that?", "Say more things.", "What you mean exactly?", "Explain me."], "j": "\"Elaborate\" = give more details.", "fr": "Pourriez-vous développer ?", "id": 55}, {"c": "c", "l": "B1", "q": "To bring the discussion back to the topic:", "o": ["Let's get back to the main point.", "You talk too much.", "Stop, other subject.", "This is not interesting."], "j": "Polite way to refocus.", "fr": "Revenons à l'essentiel.", "id": 56}, {"c": "c", "l": "B1", "q": "To summarise at the end of a meeting:", "o": ["So, to sum up, we've agreed to…", "Finish. We said things.", "That's all, bye.", "Summary: nothing."], "j": "\"To sum up…\" introduces a summary.", "fr": "Pour résumer…", "id": 57}, {"c": "c", "l": "B1", "q": "To ask for a deadline extension politely:", "o": ["Would it be possible to have a few more days?", "Give me more time.", "I need more days, OK?", "The deadline is bad."], "j": "\"Would it be possible to…?\" is polite.", "fr": "Serait-il possible de… ?", "id": 58}, {"c": "c", "l": "B1", "q": "To make a polite complaint in a restaurant:", "o": ["Excuse me, I'm afraid my soup is cold.", "This soup is horrible!", "Bring another soup now.", "Cold soup, why?"], "j": "\"I'm afraid…\" softens a complaint.", "fr": "Se plaindre poliment.", "id": 59}, {"c": "c", "l": "B1", "q": "Your manager asks for a report you haven't finished:", "o": ["I'm still working on it. I'll send it by 5 p.m.", "It's not my fault.", "I don't know when.", "Later, maybe."], "j": "Give status + a clear time.", "fr": "Donner un délai précis.", "id": 60}, {"c": "c", "l": "B1", "q": "A customer is angry. You start by saying:", "o": ["I'm sorry to hear that. Let me see what I can do.", "Calm down!", "It's not my problem.", "You are wrong."], "j": "Show empathy, then offer action.", "fr": "Montrer de l'empathie.", "id": 61}, {"c": "c", "l": "B1", "q": "To ask for a favour politely:", "o": ["Could you do me a favour?", "Do a favour for me now.", "Make me a favour.", "You must help me."], "j": "Collocation: do someone a favour.", "fr": "Rendre un service = do a favour.", "id": 62}, {"c": "c", "l": "B1", "q": "To accept an invitation:", "o": ["That sounds great. I'd love to come.", "OK, I come.", "Yes, I want.", "Good, I am coming maybe."], "j": "Enthusiastic and polite acceptance.", "fr": "Accepter avec enthousiasme.", "id": 63}, {"c": "c", "l": "B1", "q": "To make a suggestion to friends:", "o": ["Why don't we go to the beach?", "We go beach?", "Go beach, yes?", "Beach is possible we go."], "j": "\"Why don't we…?\" / \"How about…?\" / \"Let's…\" for suggestions.", "fr": "Pourquoi ne pas… ?", "id": 64}, {"c": "c", "l": "B1", "q": "\"How about going to the cinema?\" means:", "o": ["a suggestion", "a question about the past", "a complaint", "an order"], "j": "\"How about + -ing?\" = a suggestion.", "fr": "Et si on… ?", "id": 65}, {"c": "c", "l": "B1", "q": "To ask for permission:", "o": ["Is it OK if I leave early today?", "I leave early today.", "I go now, OK.", "Leave early, me."], "j": "\"Is it OK if…?\" / \"May I…?\"", "fr": "Demander la permission.", "id": 66}, {"c": "c", "l": "B1", "q": "The most formal way to ask permission:", "o": ["May I use your phone?", "Can I use your phone?", "I use your phone?", "Phone, please?"], "j": "\"May I…?\" is more formal than \"Can I…?\".", "fr": "May I… ? = plus formel.", "id": 67}, {"c": "c", "l": "B1", "q": "To show you are listening in a conversation:", "o": ["Really? That's interesting.", "Hmm, boring.", "And so?", "Whatever."], "j": "Short reactions show interest.", "fr": "Montrer qu'on écoute.", "id": 68}, {"c": "c", "l": "B1", "q": "To give bad news gently:", "o": ["Unfortunately, the flight has been cancelled.", "Bad news: no flight.", "Your flight is dead.", "No plane, sorry you."], "j": "\"Unfortunately…\" softens bad news.", "fr": "Malheureusement…", "id": 69}, {"c": "c", "l": "B1", "q": "You didn't hear a name. You ask:", "o": ["Sorry, could you spell that for me?", "Name again!", "Write me your name.", "What is your name, again, you?"], "j": "Asking someone to spell is common and polite.", "fr": "Pouvez-vous l'épeler ?", "id": 70}, {"c": "c", "l": "B1", "q": "You want to change the subject naturally:", "o": ["By the way, did you see the match last night?", "Other subject now.", "Stop that subject.", "Change topic, please."], "j": "\"By the way…\" introduces a new topic.", "fr": "Au fait…", "id": 71}, {"c": "c", "l": "B1", "q": "You want to express sympathy after bad news:", "o": ["I'm so sorry to hear that.", "Oh, that's life.", "Not my problem.", "Be happy!"], "j": "Standard sympathy phrase.", "fr": "Exprimer sa compassion.", "id": 72}, {"c": "c", "l": "B1", "q": "In an interview: \"Tell me about yourself.\" A good start is:", "o": ["I'm a marketing graduate with two years' experience in sales.", "I was born in a hospital.", "I like eating pizza.", "What do you want to know?"], "j": "Focus on professional profile.", "fr": "Présentation professionnelle.", "id": 73}, {"c": "c", "l": "B1", "q": "In an interview: \"What is your greatest weakness?\" A good answer:", "o": ["I sometimes spend too long on details, but I'm learning to prioritise.", "I have no weaknesses.", "I'm lazy.", "I hate working."], "j": "Honest weakness + what you do to improve.", "fr": "Faiblesse + amélioration.", "id": 74}, {"c": "c", "l": "B1", "q": "At the end of an interview, it's good to ask:", "o": ["What would a typical day in this role look like?", "How much holiday do I get?", "Can I go now?", "When do I get a raise?"], "j": "Shows interest in the job.", "fr": "Poser une question pertinente.", "id": 75}, {"c": "c", "l": "B1", "q": "After an interview, a good thank-you email starts:", "o": ["Thank you for taking the time to meet with me today.", "Thanks for the job.", "Did I get the job?", "Hello, it's me again."], "j": "Polite and professional.", "fr": "Remercier après un entretien.", "id": 76}, {"c": "c", "l": "B2", "q": "In a negotiation, to make a conditional offer:", "o": ["We could lower the price if you ordered 500 units.", "Lower price, buy more.", "Buy more, we give less price.", "The price is final."], "j": "Conditional offers help negotiation.", "fr": "Proposer une condition.", "id": 77}, {"c": "c", "l": "B2", "q": "To reject a proposal diplomatically:", "o": ["I'm not sure that would work for us.", "That's a terrible idea.", "No, never.", "You're joking."], "j": "Softened language sounds professional.", "fr": "Refuser avec diplomatie.", "id": 78}, {"c": "c", "l": "B2", "q": "To buy time before answering a difficult question:", "o": ["That's a good question. Let me think about it for a moment.", "I don't know.", "Next question.", "Why do you ask that?"], "j": "Shows reflection and keeps control.", "fr": "Gagner du temps.", "id": 79}, {"c": "c", "l": "B2", "q": "\"Let's touch base next week\" means:", "o": ["let's talk briefly next week", "let's play baseball", "let's end the project", "let's meet at the base"], "j": "Business idiom: make contact.", "fr": "Faisons le point.", "id": 80}, {"c": "c", "l": "B2", "q": "\"Can we take this offline?\" in a meeting means:", "o": ["discuss it later, separately", "disconnect the internet", "stop the project", "print it"], "j": "Business idiom: discuss outside the meeting.", "fr": "En parler en dehors de la réunion.", "id": 81}, {"c": "c", "l": "B2", "q": "\"I'll keep you in the loop\" means:", "o": ["I'll keep you informed", "I'll call you every hour", "I'll invite you to dinner", "I'll leave you out"], "j": "Business idiom: keep informed.", "fr": "Je vous tiens au courant.", "id": 82}, {"c": "c", "l": "B2", "q": "To politely correct a colleague:", "o": ["I might be wrong, but I think the figure is 15%, not 50%.", "You're wrong, it's 15%.", "That's false.", "Learn the numbers!"], "j": "Hedging (\"I might be wrong\") softens the correction.", "fr": "Corriger avec tact.", "id": 83}, {"c": "c", "l": "B2", "q": "To delegate a task politely:", "o": ["Would you be able to take care of the client presentation?", "You do the presentation.", "Presentation is yours now.", "I order you to do it."], "j": "Polite request for delegation.", "fr": "Déléguer poliment.", "id": 84}, {"c": "c", "l": "B2", "q": "To express uncertainty professionally:", "o": ["I'm not entirely sure, but I'll find out and get back to you.", "No idea.", "Don't ask me.", "Maybe yes maybe no."], "j": "Promise to follow up.", "fr": "Je vérifie et je reviens vers vous.", "id": 85}, {"c": "c", "l": "B2", "q": "To give constructive feedback:", "o": ["Your report is clear. One thing you could improve is the conclusion.", "Your report is bad.", "I don't like it.", "Do it again."], "j": "Positive + specific suggestion.", "fr": "Critique constructive.", "id": 86}, {"c": "c", "l": "B2", "q": "To ask for feedback:", "o": ["I'd really appreciate your feedback on my draft.", "Tell me if it's bad.", "Is it good or no?", "Read my thing."], "j": "\"I'd appreciate…\" is polite.", "fr": "Demander un avis.", "id": 87}, {"c": "c", "l": "B2", "q": "\"To be honest\" at the start of a sentence signals:", "o": ["a sincere and maybe critical opinion", "a lie", "a joke", "a question"], "j": "Introduces a frank opinion.", "fr": "Pour être franc…", "id": 88}, {"c": "c", "l": "B2", "q": "Which sentence sounds most diplomatic?", "o": ["It might be worth considering another supplier.", "Change the supplier.", "The supplier is useless.", "We need a new supplier now."], "j": "\"It might be worth…\" is a soft suggestion.", "fr": "Suggestion diplomatique.", "id": 89}, {"c": "c", "l": "B2", "q": "To end a presentation:", "o": ["Thank you for your attention. I'd be happy to answer any questions.", "Finished. Bye.", "That's all, questions no.", "OK, done, you can go."], "j": "Standard professional closing.", "fr": "Conclure une présentation.", "id": 90}, {"c": "c", "l": "B2", "q": "To introduce the structure of a presentation:", "o": ["First, I'll give an overview, then I'll present the results.", "I talk now about things.", "Here is my presentation of everything.", "Listen to me please."], "j": "Signposting helps the audience.", "fr": "Annoncer le plan.", "id": 91}, {"c": "c", "l": "B2", "q": "To move to the next point in a presentation:", "o": ["Moving on to the next point…", "Now other thing.", "Next, I am.", "Point two now come."], "j": "\"Moving on to…\" is a classic signpost.", "fr": "Passons au point suivant.", "id": 92}, {"c": "c", "l": "B2", "q": "To refer to a slide:", "o": ["As you can see on this slide, sales have doubled.", "Look the slide.", "This slide says big sales.", "See slide, sales double."], "j": "Clear reference to visuals.", "fr": "Faire référence à une diapositive.", "id": 93}, {"c": "c", "l": "B2", "q": "You don't know the answer to a question after a presentation:", "o": ["I don't have that figure with me, but I'll email it to you.", "I don't know, sorry, next.", "Good question, no answer.", "Ask someone else."], "j": "Honest + follow-up.", "fr": "Promettre une réponse.", "id": 94}, {"c": "c", "l": "B2", "q": "\"To be on the same wave t?", "Friday report, remember!"], "j": "\"Just a quick reminder…\" is friendly and polite.", "fr": "Petit rappel…", "id": 102}, {"c": "c", "l": "A2", "q": "Someone holds the door for you. You say:", "o": ["Thanks!", "Sorry!", "Bless you!", "Welcome!"], "j": "A simple thank you.", "fr": "Merci !", "id": 103}, {"c": "c", "l": "A2", "q": "You don't want any more food. You say:", "o": ["No more for me, thanks. I'm full.", "Stop food.", "Not hungry, take it.", "Enough, finish."], "j": "Polite refusal at the table.", "fr": "Je n'ai plus faim, merci.", "id": 104}, {"c": "c", "l": "A2", "q": "To introduce a friend:", "o": ["This is my friend, Yassine.", "He is friend me.", "Here friend Yassine.", "Look, Yassine."], "j": "\"This is…\" to introduce someone.", "fr": "Présenter quelqu'un.", "id": 105}, {"c": "c", "l": "A2", "q": "At the end of a conversation, a friendly goodbye:", "o": ["See you soon!", "See you never!", "Go now!", "Bye forever!"], "j": "Common friendly goodbye.", "fr": "À bientôt !", "id": 106}, {"c": "c", "l": "A2", "q": "You didn't hear because of noise. You say:", "o": ["Sorry? I didn't catch that.", "What you said?", "Again!", "Hmm? Speak!"], "j": "\"I didn't catch that\" = I didn't hear/understand.", "fr": "Je n'ai pas saisi.", "id": 107}, {"c": "c", "l": "A2", "q": "Your friend tells you good news. You react:", "o": ["That's great news!", "That's sad.", "So what?", "I don't care."], "j": "Enthusiastic reaction.", "fr": "C'est une super nouvelle !", "id": 108}, {"c": "c", "l": "A2", "q": "Your friend tells you bad news. You react:", "o": ["Oh no, I'm sorry to hear that.", "Great!", "Good for you.", "Ha ha."], "j": "Show sympathy.", "fr": "Je suis désolé(e).", "id": 109}, {"c": "c", "l": "A2", "q": "At a hotel reception, you say:", "o": ["Hello, I have a reservation under the name Benali.", "I sleep here tonight.", "Room for me.", "Give me my room."], "j": "Standard check-in phrase.", "fr": "J'ai une réservation au nom de…", "id": 110}, {"c": "c", "l": "A2 om home", "drive fast"], "j": "commute = daily trip to work.", "fr": "commute = faire le trajet domicile-travail.", "id": 286}, {"c": "v", "l": "B1", "q": "A \"traffic jam\" is:", "o": ["a long line of cars that are not moving", "a type of jam for bread", "a road accident", "a parking area"], "j": "traffic jam = embouteillage.", "fr": "bouchon, embouteillage.", "id": 287}, {"c": "v", "l": "B1", "q": "\"Rush hour\" is:", "o": ["the busy time when people go to or from work", "a sports race", "a fast train", "a late meeting"], "j": "rush hour = heure de pointe.", "fr": "heure de pointe.", "id": 288}, {"c": "v", "l": "B1", "q": "\"Overtime\" is:", "o": ["extra hours worked after normal time", "a free day", "a holiday", "a short break"], "j": "overtime = heures supplémentaires.", "fr": "heures supplémentaires.", "id": 289}, {"c": "v", "l": "B1", "q": "A \"raise\" (UK: pay rise) is:", "o": ["an increase in salary", "a promotion to manager", "a bonus party", "a tax"], "j": "raise = increase in pay.", "fr": "augmentation de salaire.", "id": 290}, {"c": "v", "l": "B1", "q": "A \"promotion\" at work is:", "o": ["a move to a higher position", "a sale price", "a holiday", "a warning"], "j": "promotion = higher job.", "fr": "promotion = avancement.", "id": 291}, {"c": "v", "l": "B1", "q": "\"Unemployed\" means:", "o": ["without a job", "retired", "self-employed", "part-time"], "j": "unemployed = no job.", "fr": "unemployed = au chômage.", "id": 292}, {"c": "v", "l": "B1", "q": "\"Part-time\" work is:", "o": ["fewer hours than a full working week", "work at night only", "work on weekends only", "unpaid work"], "j": "part-time ≠ full-time.", "fr": "temps partiel.", "id": 293}, {"c": "v", "l": "B1", "q": "\"To hire\" someone means:", "o": ["give them a job", "fire them", "meet them", "pay them back"], "j": "hire = employ.", "fr": "hire = embaucher.", "id": 294}, {"c": "v", "l": "B1", "q": "A \"shift\" at work is:", "o": ["a period of work time", "a pay slip", "an office", "a holiday"], "j": "day shift, night shift.", "fr": "shift = poste, équipe.", "id": 295}, {"c": "v", "l": "B1", "q": "An \"appointment\" is:", "o": ["a fixed meeting at a certain time", "an apartment", "a payment", "an application"], "j": "appointment = rendez-vous (doctor, dentist).", "fr": "appointment = rendez-vous.", "id": 296}, {"c": "v", "l": "B1", "q": "\"Convenient\" means:", "o": ["suitable and easy for you", "comfortable furniture", "expensive", "agreed"], "j": "Is 3 p.m. convenient for you?", "fr": "convenient = pratique (faux ami).", "id": 297}, {"c": "v", "l": "B1", "q": "\"Rather\" in \"It's rather cold\" means:", "o": ["quite, fairly", "not at all", "extremely", "never"], "j": "rather = fairly.", "fr": "rather = plutôt.", "id": 298}, {"c": "v", "l": "B1", "q": "\"Hardly\" in \"I can hardly hear you\" means:", "o": ["almost not", "very well", "loudly", "strongly"], "j": "hardly = almost not. Not the adverb of \"hard\".", "fr": "hardly = à peine.", "id": 299}, {"c": "v", "l": "B1", "q": "\"Lately\" means:", "o": ["recently", "late at night", "slowly", "later"], "j": "lately = in the recent past.", "fr": "lately = récemment.", "id": 300}, {"c": "v", "l": "B2", "q": "\"Ambiguous\" means:", "o": ["having more than one possible meaning", "very clear", "ambitious", "dangerous"], "j": "ambiguous = unclear.", "fr": "ambigu.", "id": 301}, {"c": "v", "l": "B2", "q": "\"Feasible\" means:", "o": ["possible to do", "very easy", "delicious", "expensive"], "j": "feasible = practical, achievable.", "fr": "réalisable.", "id": 302}, {"c": "v", "l": "B2", "q": "\"Mandatory\" means:", "o": ["required by rules", "optional", "forbidden", "recommended"], "j": "mandatory = compulsory.", "fr": "obligatoire.", "id": 303}, {"c": "v", "l": "B2", "q": "\"Outcome\" means:", "o": ["result", "beginning", "income", "cause"], "j": "outcome = final result.", "fr": "résultat.", "id": 304}, {"c": "v", "l": "B2", "q": "\"Drawback\" means:", "o": ["disadvantage", "benefit", "background", "delay"], "j": "drawback = negative point.", "fr": "inconvénient.", "id": 305}, {"c": "c", "l": "A2", "q": "You want to know where someone is from:", "o": ["Where are you from?", "Where you come?", "From where you are?", "You are from where country?"], "j": "Standard question.", "fr": "D'où viens-tu ?", "id": 306}, {"c": "c", "l": "A2", "q": "You want to know someone's job:", "o": ["What do you do?", "What are you doing for work now?", "What is your do?", "What work you?"], "j": "\"What do you do?\" = What is your job?", "fr": "Que faites-vous dans la vie ?", "id": 307}, {"c": "c", "l": "A2", "q": "Someone asks \"What do you do?\" You answer:", "o": ["I'm a teacher.", "I'm teaching now.", "I do teacher.", "I am do teacher."], "j": "Answer with your job: I'm a + job.", "fr": "Je suis professeur.", "id": 308}, {"c": "c", "l": "A2", "q": "Someone says \"Have a nice weekend!\" You reply:", "o": ["Thanks, you too!", "Yes, I have.", "No, I don't.", "Same weekend."], "j": "Return the wish.", "fr": "Merci, toi aussi !", "id": 309}, {"c": "c", "l": "A2", "q": "You want to ask a friend to repeat slowly:", "o": ["Could you speak more slowly, please?", "Speak slow!", "Slowly, you.", "More slow please you."], "j": "Polite request.", "fr": "Parlez plus lentement, s'il vous plaît.", "id": 310}, {"c": "c", "l": "A2", "q": "You want to know what a word means:", "o": ["What does \"deadline\" mean?", "What means \"deadline\"?", "\"Deadline\" is what mean?", "What is mean deadline?"], "j": "Question with \"does\": What does X mean?", "fr": "Que veut dire… ?", "id": 311}, {"c": "c", "l": "A2", "q": "You don't know how to say a word in English:", "o": ["How do you say \"voiture\" in English?", "How you say \"voiture\"?", "What is \"voiture\" English say?", "\"Voiture\" in English is how?"], "j": "Standard learner question.", "fr": "Comment dit-on… en anglais ?", "id": 312}, {"c": "c", "l": "A2", "q": "You arrive at a party. The host says \"Come in!\" You say:", "o": ["Thank you for inviting me.", "Yes, I come.", "OK, I'm here now.", "Party is good."], "j": "Polite thanks to the host.", "fr": "Merci de m'avoir invité.", "id": 313}, {"c": "c", "l": "A2", "q": "You need help with your suitcase on the train:", "o": ["Excuse me, could you help me with my suitcase?", "Help my suitcase!", "You carry this.", "Suitcase heavy, help."], "j": "Polite request.", "fr": "Pourriez-vous m'aider ?", "id": 314}, {"c": "c", "l": "A2", "q": "You want to say you agree with a friend informally:", "o": ["Exactly!", "Yes, you are agree.", "Agreed you.", "I'm agree."], "j": "\"Exactly!\" / \"Totally!\" show informal agreement.", "fr": "Exactement !", "id": 315}, {"c": "c", "l": "B1", "q": "To soften a request at work:", "o": ["I was wondering if you could help me with this report.", "Help me with the report.", "You will help me.", "I need you help now."], "j": "\"I was wondering if…\" is very polite.", "fr": "Je me demandais si…", "id": 316}, {"c": "c", "l": "B1", "q": "To ask a colleague to join a meeting:", "o": ["Would you be available to join the meeting at 2?", "Come to meeting 2.", "You must come at 2.", "Meeting, 2, you."], "j": "Polite invitation.", "fr": "Seriez-vous disponible… ?", "id": 317}, {"c": "c", "l": "B1", "q": "To say that something is not possible politely:", "o": ["I'm afraid that won't be possible.", "Impossible!", "No chance.", "Forget it."], "j": "\"I'm afraid…\" softens refusal.", "fr": "Je crains que ce ne soit pas possible.", "id": 318}, {"c": "c", "l": "B1", "q": "To ask for clarification in an email:", "o": ["Could you clarify what you mean by \"next steps\"?", "What is next steps?", "I don't understand you.", "Explain your email."], "j": "Polite request for clarification.", "fr": "Pourriez-vous préciser… ?", "id": 319}, {"c": "c", "l": "B1", "q": "To introduce yourself in an email:", "o": ["My name is Leila Amrani and I am the new sales manager.", "I am Leila, hello.", "It's me, Leila, new.", "Leila here, manager."], "j": "Clear and professional.", "fr": "Se présenter par e-mail.", "id": 320}, {"c": "c", "l": "B1", "q": "To say you will check something:", "o": ["Let me check and get back to you.", "Wait, I see.", "I look later maybe.", "Not now, check later."], "j": "\"Get back to you\" = reply later.", "fr": "Je vérifie et je reviens vers vous.", "id": 321}, {"c": "c", "l": "B1", "q": "To ask about someone's weekend on Monday:", "o": ["Did you have a good weekend?", "You had weekend good?", "How was weekend you?", "Weekend good or bad?"], "j": "Natural small talk.", "fr": "Bon week-end ?", "id": 322}, {"c": "c", "l": "B1", "q": "To offer a visitor a drink:", "o": ["Can I get you something to drink?", "You want drink?", "Drink for you?", "Take a drink."], "j": "Polite offer.", "fr": "Je vous sers quelque chose à boire ?", "id": 323}, {"c": "c", "l": "B1", "q": "To give someone directions:", "o": ["Go straight on, then take the second left.", "Go straight, left two.", "Straight go, then left second.", "Left, straight, finish."], "j": "Standard directions language.", "fr": "Allez tout droit, puis deuxième à gauche.", "id": 324}, {"c": "c", "l": "B1", "q": "At the doctor's, to describe pain:", "o": ["I've had a pain in my back for three days.", "My back is pain three days.", "I am back pain since three days.", "Back pain, three days, me."], "j": "Present perfect + for.", "fr": "J'ai mal au dos depuis trois jours.", "id": 325}, {"c": "c", "l": "B1", "q": "To book an appointment by phone:", "o": ["I'd like to make an appointment with Dr Alami, please.", "I want appointment doctor.", "Give me doctor time.", "Doctor, appointment, now."], "j": "Standard phrase.", "fr": "Prendre rendez-vous.", "id": 326}, {"c": "c", "l": "B1", "q": "To complain about a hotel room:", "o": ["Excuse me, the air conditioning in my room isn't working.", "Your hotel is bad.", "Room broken, fix.", "I want new hotel."], "j": "Clear and polite.", "fr": "Signaler un problème.", "id": 327}, {"c": "c", "l": "B1", "q": "To recommend a place to a friend:", "o": ["You should try the new restaurant. It's excellent.", "You must go there, it's an order.", "Restaurant good, go.", "Go eat there now."], "j": "\"You should try…\" = recommendation.", "fr": "Tu devrais essayer…", "id": 328}, {"c": "c", "l": "B1", "q": "To accept an apology from a customer:", "o": ["No problem at all. These things happen.", "Yes, it's your fault.", "OK, but don't do it again.", "Whatever."], "j": "Gracious response.", "fr": "Ce n'est rien.", "id": 329}, {"c": "c", "l": "B2", "q": "To express disagreement in a formal debate:", "o": ["With all due respect, I see things differently.", "You are completely wrong.", "That's nonsense.", "I don't agree, stop."], "j": "\"With all due respect…\" is formal and polite.", "fr": "Sauf votre respect…", "id": 330}, {"c": "c", "l": "B2", "q": "To present an opposing argument in writing:", "o": ["On the other hand, some people argue that…", "But other people say no.", "The contrary is…", "Opposite, people think…"], "j": "\"On the other hand\" introduces a contrast.", "fr": "D'un autre côté…", "id": 331}, {"c": "c", "l": "B2", "q": "To add an argument in an essay:", "o": ["Furthermore, it reduces costs.", "And also more, it reduces costs.", "Plus more, costs reduce.", "Too, it reduces costs."], "j": "\"Furthermore\" / \"Moreover\" add a point.", "fr": "De plus…", "id": 332}, {"c": "c", "l": "B2", "q": "To conclude an essay:", "o": ["In conclusion, the benefits outweigh the drawbacks.", "To finish, it's good.", "End: good.", "Finally of all, OK."], "j": "\"In conclusion…\" introduces the final point.", "fr": "En conclusion…", "id": 333}, {"c": "c", "l": "B2", "q": "To give an example in an essay:", "o": ["For instance, many cities have banned cars.", "Example: cities banned cars.", "Like example, cities…", "Such example cities banned."], "j": "\"For instance\" = for example.", "fr": "Par exemple…", "id": 334}, {"c": "g", "l": "A2", "q": "She ___ to school every day.", "o": ["goes", "go", "going", "gone"], "j": "Present simple with he / she / it: add -s to the verb.", "fr": "Au présent simple, on ajoute -s après he / she / it.", "id": 335}, {"c": "g", "l": "A2", "q": "There ___ many people at the party yesterday.", "o": ["were", "was", "is", "are"], "j": "\"Yesterday\" needs the past; \"many people\" is plural, so: there were.", "fr": "Passé + pluriel = there were.", "id": 336}, {"c": "g", "l": "A2", "q": "He is ___ honest man.", "o": ["an", "a", "the", "(no article)"], "j": "\"Honest\" starts with a vowel sound (the h is silent), so use \"an\".", "fr": "a/an dépend du son : « honest » se prononce sans h.", "id": 337}, {"c": "g", "l": "A2", "q": "This is the ___ film I have ever seen.", "o": ["best", "better", "most good", "goodest"], "j": "The superlative of \"good\" is \"the best\".", "fr": "good → better → the best.", "id": 338}, {"c": "g", "l": "A2", "q": "I don't have ___ money left.", "o": ["any", "some", "many", "a"], "j": "Use \"any\" in negative sentences. \"Money\" is uncountable, so not \"many\".", "fr": "Phrase négative → any. Money est indénombrable.", "id": 339}, {"c": "g", "l": "A2", "q": "She speaks English very ___.", "o": ["well", "good", "goodly", "nice"], "j": "\"Well\" is the adverb (how she speaks). \"Good\" is an adjective.", "fr": "well = adverbe (bien) ; good = adjectif (bon).", "id": 340}, {"c": "g", "l": "A2", "q": "How ___ sugar do you want?", "o": ["much", "many", "lot", "few"], "j": "\"Sugar\" is uncountable, so use \"how much\".", "fr": "Indénombrable → how much ; dénombrable → how many.", "id": 341}, {"c": "g", "l": "A2", "q": "You ___ wear a seatbelt. It's the law.", "o": ["must", "might", "can", "would"], "j": "\"Must\" expresses obligation.", "fr": "must = obligation.", "id": 342}, {"c": "g", "l": "A2", "q": "My sister ___ like coffee.", "o": ["doesn't", "don't", "isn't", "not"], "j": "Negative present simple with he / she / it: doesn't + base verb.", "fr": "Négation avec he / she / it : doesn't + verbe.", "id": 343}, {"c": "g", "l": "A2", "q": "___ you speak French?", "o": ["Do", "Are", "Does", "Is"], "j": "Questions in the present simple with \"you\" use \"do\".", "fr": "Question au présent simple avec you : Do.", "id": 344}, {"c": "g", "l": "A2", "q": "Look! The children ___ in the garden.", "o": ["are playing", "play", "plays", "played"], "j": "\"Look!\" shows an action happening now: present continuous.", "fr": "Action en cours maintenant = be + -ing.", "id": 345}, {"c": "g", "l": "A2", "q": "I ___ to London last summer.", "o": ["went", "go", "have gone", "goes"], "j": "\"Last summer\" is a finished time: past simple.", "fr": "Moment passé terminé (last summer) = prétérit.", "id": 346}, {"c": "g", "l": "A2", "q": "We ___ TV when you called.", "o": ["were watching", "watched", "are watching", "watch"], "j": "Past continuous for an action in progress when something else happened.", "fr": "Action en cours dans le passé = was/were + -ing.", "id": 347}, {"c": "g", "l": "A2", "q": "Did you ___ the email?", "o": ["send", "sent", "sending", "sends"], "j": "After \"did\", use the base form of the verb.", "fr": "Après did : verbe à l'infinitif sans to.", "id": 348}, {"c": "g", "l": "A2", "q": "She is ___ than her brother.", "o": ["taller", "more tall", "tallest", "more taller"], "j": "Short adjectives: add -er for the comparative.", "fr": "Adjectif court + -er + than.", "id": 349}, {"c": "g", "l": "A2", "q": "This exercise is ___ than the last one.", "o": ["more difficult", "difficulter", "most difficult", "more difficulter"], "j": "Long adjectives: more + adjective + than.", "fr": "Adjectif long : more + adjectif.", "id": 350}, {"c": "g", "l": "A2", "q": "I'm going ___ my grandparents this weekend.", "o": ["to visit", "visit", "visiting", "visited"], "j": "\"Be going to + base verb\" for plans.", "fr": "be going to + verbe = intention / projet.", "id": 351}, {"c": "g", "l": "A2", "q": "The meeting is ___ Monday.", "o": ["on", "in", "at", "by"], "j": "Use \"on\" with days and dates.", "fr": "on + jour / date.", "id": 352}, {"c": "g", "l": "A2", "q": "I was born ___ 1998.", "o": ["in", "on", "at", "since"], "j": "Use \"in\" with years, months and seasons.", "fr": "in + année / mois / saison.", "id": 353}, {"c": "g", "l": "A2", "q": "The class starts ___ 9 o'clock.", "o": ["at", "in", "on", "by"], "j": "Use \"at\" with clock times.", "fr": "at + heure.", "id": 354}, {"c": "g", "l": "A2", "q": "There isn't ___ milk in the fridge.", "o": ["much", "many", "a few", "several"], "j": "\"Milk\" is uncountable: much (in negatives and questions).", "fr": "Indénombrable → much.", "id": 355}, {"c": "g", "l": "A2", "q": "I have ___ friends in Canada.", "o": ["a few", "a little", "much", "any"], "j": "\"Friends\" is countable: a few. \"A little\" is for uncountable nouns.", "fr": "Dénombrable → a few ; indénombrable → a little.", "id": 356}, {"c": "g", "l": "A2", "q": "Whose book is this? It's ___.", "o": ["mine", "my", "me", "I"], "j": "Possessive pronoun (without a noun after it): mine.", "fr": "mine = le mien (sans nom après).", "id": 357}, {"c": "g", "l": "A2", "q": "They ___ from Morocco.", "o": ["are", "is", "am", "be"], "j": "\"They\" takes \"are\".", "fr": "they + are.", "id": 358}, {"c": "g", "l": "A2", "q": "Can you help ___, please?", "o": ["me", "I", "my", "mine"], "j": "After a verb, use the object pronoun: me.", "fr": "Après un verbe : pronom complément (me, him, her…).", "id": 359}, {"c": "g", "l": "A2", "q": "He ___ his homework yet.", "o": ["hasn't finished", "didn't finish", "doesn't finish", "not finished"], "j": "\"Yet\" in negatives goes with the present perfect.", "fr": "yet (négatif) → present perfect.", "id": 360}, {"c": "g", "l": "A2", "q": "I have ___ been to Japan.", "o": ["never", "ever", "yet", "already not"], "j": "\"Never\" = at no time in my life. Present perfect for life experience.", "fr": "never = jamais (expérience de vie).", "id": 361}, {"c": "g", "l": "A2", "q": "Have you ___ eaten sushi?", "o": ["ever", "never", "yet", "since"], "j": "\"Ever\" in questions about life experience.", "fr": "ever = déjà (dans une question).", "id": 362}, {"c": "g", "l": "A2", "q": "We ___ here for three years.", "o": ["have lived", "live", "are living", "lived since"], "j": "\"For + period\" up to now: present perfect.", "fr": "for + durée jusqu'à maintenant = present perfect.", "id": 363}, {"c": "g", "l": "A2", "q": "She ___ a new phone last week.", "o": ["bought", "buyed", "has bought", "buys"], "j": "\"Buy\" is irregular: buy – bought – bought. \"Last week\" needs past simple.", "fr": "buy → bought (irrégulier).", "id": 364}, {"c": "g", "l": "A2", "q": "I ___ you tomorrow.", "o": ["will call", "call", "called", "calling"], "j": "\"Will + base verb\" for a future decision or promise.", "fr": "will + verbe = futur.", "id": 365}, {"c": "g", "l": "A2", "q": "It's cold. I ___ close the window.", "o": ["'ll", "am", "did", "have"], "j": "Decision made at the moment of speaking: will ('ll).", "fr": "Décision spontanée = will.", "id": 366}, {"c": "g", "l": "A2", "q": "___ is your birthday?", "o": ["When", "Who", "What time is", "Where"], "j": "\"When\" asks about a time or date.", "fr": "When = quand.", "id": 367}, {"c": "g", "l": "A2", "q": "___ do you go to work? By bus.", "o": ["How", "What", "Where", "Why"], "j": "\"How\" asks about the way or method.", "fr": "How = comment.", "id": 368}, {"c": "g", "l": "A2", "q": "___ car is that? It's Ahmed's.", "o": ["Whose", "Who", "Who's", "Which's"], "j": "\"Whose\" asks about the owner.", "fr": "Whose = à qui.", "id": 369}, {"c": "g", "l": "A2", "q": "I can't find ___ keys.", "o": ["my", "me", "mine", "I"], "j": "Possessive adjective before a noun: my.", "fr": "my + nom (mon / ma / mes).", "id": 370}, {"c": "g", "l": "A2", "q": "The cat is sleeping ___ the table.", "o": ["under", "between", "among", "during"], "j": "\"Under\" = below something.", "fr": "under = sous.", "id": 371}, {"c": "g", "l": "A2", "q": "There ___ a bank near my house.", "o": ["is", "are", "be", "have"], "j": "\"A bank\" is singular: there is.", "fr": "Singulier → there is.", "id": 372}, {"c": "g", "l": "A2", "q": "She ___ two brothers.", "o": ["has", "have", "is", "does"], "j": "\"She\" + have → has.", "fr": "he / she / it + has.", "id": 373}, {"c": "g", "l": "A2", "q": "My parents ___ dinner at 8 every evening.", "o": ["have", "has", "having", "are have"], "j": "\"My parents\" is plural: have.", "fr": "Sujet pluriel → have.", "id": 374}, {"c": "g", "l": "A2", "q": "Don't ___ noise. The baby is sleeping.", "o": ["make", "do", "making", "to make"], "j": "Negative imperative: Don't + base verb. We say \"make a noise\".", "fr": "Impératif négatif : Don't + verbe.", "id": 375}, {"c": "g", "l": "A2", "q": "I'm ___. Can I have a sandwich?", "o": ["hungry", "hunger", "hungrily", "hungering"], "j": "After \"be\", use an adjective: hungry.", "fr": "be + adjectif.", "id": 376}, {"c": "g", "l": "A2", "q": "He usually ___ up at 7.", "o": ["gets", "get", "is getting", "got"], "j": "\"Usually\" = habit: present simple, + s with he.", "fr": "Habitude = présent simple.", "id": 377}, {"c": "g", "l": "A2", "q": "I ___ swim when I was five.", "o": ["could", "can", "can't to", "could to"], "j": "\"Could\" is the past of \"can\" (ability).", "fr": "could = passé de can.", "id": 378}, {"c": "g", "l": "A2", "q": "You ___ smoke here. It's forbidden.", "o": ["mustn't", "don't have to", "needn't", "can"], "j": "\"Mustn't\" = it is not allowed. \"Don't have to\" = it is not necessary.", "fr": "mustn't = interdiction ; don't have to = pas obligatoire.", "id": 379}, {"c": "g", "l": "A2", "q": "You ___ bring food. Lunch is provided.", "o": ["don't have to", "mustn't", "can't", "shouldn't to"], "j": "\"Don't have to\" = it is not necessary.", "fr": "don't have to = ce n'est pas nécessaire.", "id": 380}, {"c": "g", "l": "A2", "q": "___ you like some tea?", "o": ["Would", "Do", "Will", "Are"], "j": "\"Would you like…?\" is a polite offer.", "fr": "Would you like… ? = Voulez-vous… ? (poli)", "id": 381}, {"c": "g", "l": "A2", "q": "I enjoy ___ books.", "o": ["reading", "to read", "read", "reads"], "j": "\"Enjoy\" is followed by -ing.", "fr": "enjoy + -ing.", "id": 382}, {"c": "g", "l": "A2", "q": "I want ___ a doctor.", "o": ["to become", "becoming", "become", "became"], "j": "\"Want\" is followed by to + verb.", "fr": "want + to + verbe.", "id": 383}, {"c": "g", "l": "A2", "q": "These ___ are very expensive.", "o": ["shoes", "shoe", "shoes's", "shoeses"], "j": "\"These\" is plural, so the noun is plural.", "fr": "these / those + pluriel.", "id": 384}, {"c": "g", "l": "A2", "q": "I saw three ___ at the farm.", "o": ["sheep", "sheeps", "sheepes", "a sheep"], "j": "\"Sheep\" has the same form in the plural.", "fr": "sheep est invariable au pluriel.", "id": 385}, {"c": "g", "l": "A2", "q": "Two ___ were waiting outside.", "o": ["women", "womans", "womens", "woman"], "j": "Irregular plural: woman → women.", "fr": "woman → women (pluriel irrégulier).", "id": 386}, {"c": "g", "l": "A2", "q": "He drives very ___.", "o": ["carefully", "careful", "carefull", "care"], "j": "Adverb of manner: adjective + -ly.", "fr": "Adverbe de manière : adjectif + -ly.", "id": 387}, {"c": "g", "l": "A2", "q": "We didn't go out ___ it was raining.", "o": ["because", "so", "but", "although"], "j": "\"Because\" gives the reason.", "fr": "because = parce que.", "id": 388}, {"c": "g", "l": "A2", "q": "It was late, ___ we went home.", "o": ["so", "because", "but", "or"], "j": "\"So\" gives the result.", "fr": "so = donc.", "id": 389}, {"c": "g", "l": "A2", "q": "I'd like ___ apple, please.", "o": ["an", "a", "some", "any"], "j": "\"Apple\" starts with a vowel sound: an.", "fr": "an + son voyelle.", "id": 390}, {"c": "g", "l": "A2", "q": "___ sun is very hot today.", "o": ["The", "A", "An", "(no article)"], "j": "There is only one sun: use \"the\".", "fr": "the pour une chose unique.", "id": 391}, {"c": "g", "l": "A2", "q": "I play ___ football on Saturdays.", "o": ["(no article)", "the", "a", "an"], "j": "No article before sports.", "fr": "Pas d'article devant les sports.", "id": 392}, {"c": "g", "l": "A2", "q": "She plays ___ piano very well.", "o": ["the", "a", "(no article)", "an"], "j": "We usually use \"the\" before musical instruments.", "fr": "the + instrument de musique.", "id": 393}, {"c": "g", "l": "A2", "q": "What ___ you doing now?", "o": ["are", "do", "is", "does"], "j": "Present continuous question: are + subject + -ing.", "fr": "Question au présent continu : are + sujet + -ing.", "id": 394}, {"c": "g", "l": "A2", "q": "He ___ a shower at the moment.", "o": ["is having", "has", "have", "had"], "j": "\"At the moment\" = now: present continuous.", "fr": "at the moment → présent continu.", "id": 395}, {"c": "g", "l": "A2", "q": "I ___ understand this word.", "o": ["don't", "doesn't", "not", "am not"], "j": "Negative with I: don't + base verb.", "fr": "I + don't + verbe.", "id": 396}, {"c": "g", "l": "A2", "q": "Where ___ you yesterday?", "o": ["were", "was", "did", "are"], "j": "Past of \"be\" with you: were.", "fr": "you / we / they + were.", "id": 397}, {"c": "g", "l": "A2", "q": "I ___ at home last night.", "o": ["was", "were", "been", "am"], "j": "Past of \"be\" with I: was.", "fr": "I / he / she / it + was.", "id": 398}, {"c": "g", "l": "A2", "q": "Did she call you? Yes, she ___.", "o": ["did", "does", "called", "was"], "j": "Short answer in the past simple: Yes, she did.", "fr": "Réponse courte : Yes, she did.", "id": 399}, {"c": "g", "l": "A2", "q": "My brother is ___ engineer.", "o": ["an", "a", "the", "one"], "j": "Jobs take a/an in English; \"engineer\" starts with a vowel sound.", "fr": "En anglais, on met a/an devant un métier.", "id": 400}, {"c": "g", "l": "A2", "q": "This bag is too heavy. I can't carry ___.", "o": ["it", "him", "them", "its"], "j": "\"Bag\" is a thing (singular): it.", "fr": "it pour un objet singulier.", "id": 401}, {"c": "g", "l": "A2", "q": "Those flowers are beautiful. Who gave ___ to you?", "o": ["them", "it", "they", "their"], "j": "Plural object pronoun: them.", "fr": "them = les / eux.", "id": 402}, {"c": "g", "l": "A2", "q": "Let's ___ to the beach.", "o": ["go", "to go", "going", "goes"], "j": "\"Let's\" + base verb.", "fr": "Let's + verbe.", "id": 403}, {"c": "g", "l": "A2", "q": "There are ___ eggs in the box. Let's buy more.", "o": ["only a few", "a lot", "much", "a little"], "j": "\"Eggs\" is countable; \"only a few\" = not many.", "fr": "only a few = seulement quelques-uns.", "id": 404}, {"c": "g", "l": "A2", "q": "I usually go to bed ___ midnight.", "o": ["at", "in", "on", "to"], "j": "\"At midnight\", \"at noon\", \"at night\".", "fr": "at midnight.", "id": 405}, {"c": "g", "l": "B1", "q": "I ___ in Casablanca since 2015.", "o": ["have lived", "live", "am living", "lived"], "j": "Present perfect with since / for for something that started in the past and continues now.", "fr": "« depuis » + action qui continue = present perfect.", "id": 406}, {"c": "g", "l": "B1", "q": "If I ___ rich, I would travel the world.", "o": ["were", "am", "will be", "have been"], "j": "Second conditional (imaginary): If + past simple, would + verb. \"If I were\" is the standard form.", "fr": "Condition imaginaire : If + prétérit, would + verbe.", "id": 407}, {"c": "g", "l": "B1", "q": "I'm not used to ___ up early.", "o": ["getting", "get", "got", "gets"], "j": "\"Be used to\" is followed by a noun or a verb in -ing.", "fr": "be used to + -ing = être habitué à.", "id": 408}, {"c": "g", "l": "B1", "q": "Can you tell me where the station ___?", "o": ["is", "is it", "does it", "are"], "j": "Indirect question: normal word order (subject + verb).", "fr": "Question indirecte : pas d'inversion.", "id": 409}, {"c": "g", "l": "B1", "q": "They ___ dinner when the phone rang.", "o": ["were having", "had", "have", "are having"], "j": "Past continuous for an action in progress, interrupted by the past simple.", "fr": "Action en cours interrompue = past continuous.", "id": 410}, {"c": "g", "l": "B1", "q": "She is interested ___ learning Spanish.", "o": ["in", "on", "at", "for"], "j": "Fixed expression: interested in.", "fr": "interested in = intéressé par.", "id": 411}, {"c": "g", "l": "B1", "q": "He ___ smoke, but now he doesn't.", "o": ["used to", "use to", "was used to", "uses to"], "j": "\"Used to + verb\" = past habit that is no longer true.", "fr": "used to + verbe = habitude passée.", "id": 412}, {"c": "g", "l": "B1", "q": "The book ___ by millions of people.", "o": ["has been read", "has read", "have been read", "is reading"], "j": "Passive present perfect: has been + past participle.", "fr": "Passif : has been + participe passé.", "id": 413}, {"c": "g", "l": "B1", "q": "I wish I ___ more free time.", "o": ["had", "have", "will have", "having"], "j": "\"I wish\" about the present + past simple.", "fr": "I wish + prétérit (regret présent).", "id": 414}, {"c": "g", "l": "B1", "q": "I look forward to ___ from you.", "o": ["hearing", "hear", "heard", "be hearing"], "j": "In \"look forward to\", \"to\" is a preposition: verb + -ing.", "fr": "look forward to + -ing.", "id": 415}, {"c": "g", "l": "B1", "q": "If it rains tomorrow, we ___ at home.", "o": ["will stay", "would stay", "stayed", "stay will"], "j": "First conditional (real possibility): If + present, will + verb.", "fr": "Condition réelle : If + présent, will + verbe.", "id": 416}, {"c": "g", "l": "B1", "q": "If you heat ice, it ___.", "o": ["melts", "will melted", "melted", "would melt"], "j": "Zero conditional (general truth): If + present, present.", "fr": "Vérité générale : If + présent, présent.", "id": 417}, {"c": "g", "l": "B1", "q": "The letter ___ yesterday.", "o": ["was sent", "sent", "is sent", "has sent"], "j": "Passive past simple: was / were + past participle.", "fr": "Passif au passé : was + participe passé.", "id": 418}, {"c": "g", "l": "B1", "q": "English ___ all over the world.", "o": ["is spoken", "speaks", "is speaking", "spoken"], "j": "Passive present simple: is + past participle.", "fr": "Passif présent : is + participe passé.", "id": 419}, {"c": "g", "l": "B1", "q": "She said that she ___ tired.", "o": ["was", "is being", "were", "be"], "j": "Reported speech: present \"I am\" usually becomes past \"she was\".", "fr": "Discours indirect : le présent recule au passé.", "id": 420}, {"c": "g", "l": "B1", "q": "He asked me ___ I liked my job.", "o": ["if", "that", "what", "do"], "j": "Reported yes/no question: if / whether.", "fr": "Question indirecte fermée : if / whether.", "id": 421}, {"c": "g", "l": "B1", "q": "This is the man ___ helped me.", "o": ["who", "which", "whose", "whom he"], "j": "\"Who\" is the relative pronoun for people (subject).", "fr": "who = qui (personne).", "id": 422}, {"c": "g", "l": "B1", "q": "The phone ___ I bought is broken.", "o": ["that", "who", "whose", "what"], "j": "\"That\" / \"which\" for things.", "fr": "that / which = que (chose).", "id": 423}, {"c": "g", "l": "B1", "q": "That's the girl ___ father is a pilot.", "o": ["whose", "who", "who's", "which"], "j": "\"Whose\" shows possession in relative clauses.", "fr": "whose = dont (possession).", "id": 424}, {"c": "g", "l": "B1", "q": "I've known her ___ ten years.", "o": ["for", "since", "during", "from"], "j": "\"For\" + a period of time.", "fr": "for + durée ; since + point de départ.", "id": 425}, {"c": "g", "l": "B1", "q": "I've been waiting ___ 8 o'clock.", "o": ["since", "for", "from", "during"], "j": "\"Since\" + a point in time.", "fr": "since + moment précis.", "id": 426}, {"c": "g", "l": "B1", "q": "How long ___ you been learning English?", "o": ["have", "are", "did", "do"], "j": "Present perfect continuous question: How long have you been + -ing?", "fr": "How long have you been… ? = depuis combien de temps…", "id": 427}, {"c": "g", "l": "B1", "q": "She ___ all day, so she's tired.", "o": ["has been working", "works", "is worked", "had work"], "j": "Present perfect continuous for a long recent activity with a visible result.", "fr": "Activité longue récente = have been + -ing.", "id": 428}, {"c": "g", "l": "B1", "q": "When I arrived, the train ___.", "o": ["had already left", "already left", "has already left", "was already leave"], "j": "Past perfect for an action before another past action.", "fr": "Action antérieure dans le passé = had + participe passé.", "id": 429}, {"c": "g", "l": "B1", "q": "You ___ see a doctor about that cough.", "o": ["should", "would", "must to", "ought"], "j": "\"Should\" gives advice.", "fr": "should = conseil.", "id": 430}, {"c": "g", "l": "B1", "q": "She ___ be at home. The lights are on.", "o": ["must", "can't", "mustn't", "should to"], "j": "\"Must\" here = logical certainty (I'm sure).", "fr": "must = sûrement (déduction).", "id": 431}, {"c": "g", "l": "B1", "q": "He ___ be the thief. He was with me all evening.", "o": ["can't", "mustn't", "shouldn't", "doesn't have to"], "j": "\"Can't\" = logical impossibility.", "fr": "can't = impossible (déduction).", "id": 432}, {"c": "g", "l": "B1", "q": "It ___ rain later. Take an umbrella.", "o": ["might", "must", "has to", "should to"], "j": "\"Might\" = possibility.", "fr": "might = peut-être.", "id": 433}, {"c": "g", "l": "B1", "q": "I stopped ___ two years ago.", "o": ["smoking", "to smoke", "smoke", "smoked"], "j": "\"Stop + -ing\" = quit an activity.", "fr": "stop + -ing = arrêter de faire.", "id": 434}, {"c": "g", "l": "B1", "q": "On the way home, I stopped ___ some bread.", "o": ["to buy", "buying", "buy", "bought"], "j": "\"Stop + to + verb\" = stop in order to do something.", "fr": "stop + to = s'arrêter pour.", "id": 435}, {"c": "g", "l": "B1", "q": "Don't forget ___ the door.", "o": ["to lock", "locking", "lock", "locked"], "j": "\"Forget + to\" = forget to do something in the future.", "fr": "forget to + verbe = oublier de faire.", "id": 436}, {"c": "g", "l": "B1", "q": "I'll never forget ___ the Eiffel Tower for the first time.", "o": ["seeing", "to see", "see", "saw"], "j": "\"Forget + -ing\" = memory of a past experience.", "fr": "forget + -ing = souvenir d'une expérience passée.", "id": 437}, {"c": "g", "l": "B1", "q": "She avoided ___ the question.", "o": ["answering", "to answer", "answer", "answered"], "j": "\"Avoid\" is followed by -ing.", "fr": "avoid + -ing.", "id": 438}, {"c": "g", "l": "B1", "q": "They decided ___ a new car.", "o": ["to buy", "buying", "buy", "bought"], "j": "\"Decide\" is followed by to + verb.", "fr": "decide + to + verbe.", "id": 439}, {"c": "g", "l": "B1", "q": "My boss made me ___ late.", "o": ["work", "to work", "working", "worked"], "j": "\"Make someone do something\" (no \"to\").", "fr": "make + quelqu'un + verbe sans to.", "id": 440}, {"c": "g", "l": "B1", "q": "My parents let me ___ out late.", "o": ["stay", "to stay", "staying", "stayed"], "j": "\"Let someone do something\" (no \"to\").", "fr": "let + quelqu'un + verbe sans to.", "id": 441}, {"c": "g", "l": "B1", "q": "I had my car ___ yesterday.", "o": ["repaired", "repair", "repairing", "to repair"], "j": "\"Have something done\" = someone else does it for you.", "fr": "have + objet + participe passé = faire faire.", "id": 442}, {"c": "g", "l": "B1", "q": "The film was so ___ that I fell asleep.", "o": ["boring", "bored", "bore", "boredom"], "j": "-ing adjectives describe the thing; -ed adjectives describe how a person feels.", "fr": "-ing = ce qui provoque ; -ed = ce qu'on ressent.", "id": 443}, {"c": "g", "l": "B1", "q": "I was very ___ by the news.", "o": ["surprised", "surprising", "surprise", "surprisingly"], "j": "\"-ed\" adjective for the person's feeling.", "fr": "-ed pour le sentiment de la personne.", "id": 444}, {"c": "g", "l": "B1", "q": "He is ___ intelligent ___ his sister.", "o": ["as / as", "so / than", "as / than", "more / as"], "j": "Equality: as + adjective + as.", "fr": "as … as = aussi … que.", "id": 445}, {"c": "g", "l": "B1", "q": "It's ___ expensive for me to buy.", "o": ["too", "enough", "very much", "so much"], "j": "\"Too + adjective\" = more than acceptable.", "fr n (UK) / fill out (US) = complete a form.", "fr": "fill in = remplir (formulaire).", "id": 756}, {"c": "v", "l": "B1", "q": "I ___ well with my colleagues.", "o": ["get on", "get off", "get over", "get by"], "j": "get on (well) with = have a good relationship.", "fr": "get on with = bien s'entendre avec.", "id": 757}, {"c": "v", "l": "B1", "q": "It took me weeks to ___ the flu.", "o": ["get over", "get on", "get through to", "get up"], "j": "get over = recover from.", "fr": "get over = se remettre de.", "id": 758}, {"c": "v", "l": "B1", "q": "Can you ___ the children while I'm out?", "o": ["look after", "look up", "look into", "look forward"], "j": "look after = take care of.", "fr": "look after = garder, s'occuper de.", "id": 759}, {"c": "v", "l": "B1", "q": "The police are ___ the robbery.", "o": ["looking into", "looking after", "looking up", "looking out"], "j": "look into = investigate.", "fr": "look into = enquêter sur.", "id": 760}, {"c": "v", "l": "B1", "q": "___! There's a car coming!", "o": ["Look out", "Look up", "Look after", "Look over"], "j": "look out = be careful.", "fr": "Look out! = Attention !", "id": 761}, {"c": "v", "l": "B1", "q": "Can you ___ me ___ at the station at 6?", "o": ["pick / up", "pick / out", "take / up", "get / up"], "j": "pick someone up = collect them in a car.", "fr": "pick up = aller chercher.", "id": 762}, {"c": "v", "l": "B1", "q": "The alarm ___ at 3 a.m.", "o": ["went off", "went out", "went on", "went down"], "j": "go off (alarm) = start ringing.", "fr": "go off = sonner.", "id": 763}, {"c": "v", "l": "B1", "q": "Prices have ___ again this year.", "o": ["gone up", "gone off", "gone out", "gone over"], "j": "go up = increase.", "fr": "go up = augmenter.", "id": 764}, {"c": "v", "l": "B1", "q": "I can't ___ what he is saying. He speaks too fast.", "o": ["make out", "make up", "make for", "make off"], "j": "make out = understand with difficulty.", "fr": "make out = distinguer, comprendre.", "id": 765}, {"c": "v", "l": "B1", hold up", "hold off", "hold out"], "j": "hold on = wait (on the phone).", "fr": "hold on = patientez.", "id": 775}, {"c": "v", "l": "B1", "q": "I'll ___ you ___ tomorrow. I'm busy now.", "o": ["call / back", "call / off", "call / up for", "call / in"], "j": "call back = return a phone call.", "fr": "call back = rappeler.", "id": 776}, {"c": "v", "l": "B1", "q": "\"It's a piece of cake\" means:", "o": ["it's very easy", "it's delicious", "it's small", "it's expensive"], "j": "Idiom: very easy.", "fr": "C'est du gâteau = très facile.", "id": 777}, {"c": "v", "l": "B1", "q": "\"I'm feeling under the weather\" means:", "o": ["I'm a bit ill", "I'm outside in the rain", "I'm very happy", "I'm cold"], "j": "Idiom: slightly sick.", "fr": "un peu malade.", "id": 778}, {"c": "v", "l": "B1", "q": "\"Break the ice\" means:", "o": ["start a conversation in a relaxed way", "destroy something", "go skating", "make someone angry"], "j": "Idiom: make people feel comfortable at the start.", "fr": "briser la glace.", "id": 779}, {"c": "v", "l": "B1", "q": "\"It costs an arm and a leg\" means:", "o": ["it's very expensive", "it's dangerous", "it's cheap", "it hurts"], "j": "Idiom: very expensive.", "fr": "coûter les yeux de la tête.", "id": 780}, {"c": "v", "l": "B1", "q": "\"Hit the books\" means:", "o": ["study hard", "throw books", "write a book", "go to the library to sleep"], "j": "Idiom: study.", "fr": "bûcher, réviser.", "id": 781}, {"c": "v", "l": "B1", "q": "\"Once in a blue moon\" means:", "o": ["very rarely", "every month", "at night", "when it's sad"], "j": "Idiom: very rarely.", "fr": "tous les 36 du mois.", "id": 782}, {"c": "v", "l": "B1", "q": "\"Keep an eye on\" means:", "o": ["watch carefully", "close one eye", "ignore", "look at quickly"], "j": "Idiom: watch, supervise.", "fr": "garder un œil sur.", "id": 783}, {"c": "v", "l": "B1", "q": "\"I'm all ears\" means:", "o": ["I'm listening carefully", "I don't hear well", "I'm tired", "I'm confused"], "j": "Idiom: ready to listen.", "fr": "Je suis tout ouïe.", "id": 784}, {"c": "v", "l": "B1", "q": "\"Call it a day\" means:", "o": ["stop working for today", "phone someone", "start a new day", "name a date"], "j": "Idiom: finish work for the day.", "fr": "s'arrêter là pour aujourd'hui.", "id": 785}, {"c": "v", "l": "B1", "q": "\"On the same page\" means:", "o": ["in agreement", "reading together", "in the same office", "confused"], "j": "Idiom: sharing the same understanding.", "fr": "sur la même longueur d'onde.", "id": 786}, {"c": "v", "l": "B2", "q": "\"Let the cat out of the bag\" means:", "o": ["reveal a secret", "free an animal", "make a mistake", "go shopping"], "j": "Idiom: tell a secret by accident.", "fr": "vendre la mèche.", "id": 787}, {"c": "v", "l": "B2", "q": "\"Beat around the bush\" means:", "o": ["avoid saying something directly", "work in the garden", "win easily", "hurry"], "j": "Idiom: avoid the main point.", "fr": "tourner autour du pot.", "id": 788}, {"c": "v", "l": "B2", "q": "\"Bite off more than you can chew\" means:", "o": ["take on too much", "eat too fast", "be rude", "be very hungry"], "j": "Idiom: accept more work than you can handle.", "fr": "avoir les yeux plus gros que le ventre.", "id": 789}, {"c": "v", "l": "B2", "q": "\"The ball is in your court\" means:", "o": ["it's your decision now", "you are playing tennis", "you lost", "it's not your problem"], "j": "Idiom: it's your turn to act.", "fr": "C'est à toi de jouer.", "id": 790}, {"c": "v", "l": "B2", "q": "\"Cut corners\" means:", "o": ["do something cheaply or badly to save time", "drive fast", "decorate", "save money wisely"], "j": "Idiom: skip important steps.", "fr": "bâcler.", "id": 791}, {"c": "v", "l": "B2", "q": "\"Get the hang of something\" means:", "o": ["learn how to do it", "hang it on the wall", "give up", "forget it"], "j": "Idiom: become skilled after practice.", "fr": "prendre le coup de main.", "id": 792}, {"c": "v", "l": "B2", "q": "\"Think outside the box\" means:", "o": ["thi
