egin", "bring forward"], "j": "postpone = put off.", "fr": "postpone = reporter.", "id": 821}, {"c": "v", "l": "B2", "q": "\"To enhance\" means:", "o": ["improve", "reduce", "destroy", "hide"], "j": "enhance = make better.", "fr": "enhance = améliorer.", "id": 822}, {"c": "v", "l": "B2", "q": "\"To acknowledge\" means:", "o": ["admit or recognise", "ignore", "learn", "deny"], "j": "acknowledge = accept the truth of something.", "fr": "acknowledge = reconnaître.", "id": 823}, {"c": "v", "l": "B2", "q": "\"To tackle a problem\" means:", "o": ["deal with it", "avoid it", "create it", "describe it"], "j": "tackle = make an effort to deal with.", "fr": "tackle = s'attaquer à.", "id": 824}, {"c": "v", "l": "B2", "q": "\"Nevertheless\" means:", "o": ["however", "because", "therefore", "moreover"], "j": "nevertheless = in spite of that.", "fr": "nevertheless = néanmoins.", "id": 825}, {"c": "v", "l": "B2", "q": "\"Moreover\" means:", "o": ["in addition", "however", "instead", "therefore"], "j": "moreover = furthermore, also.", "fr": "moreover = de plus.", "id": 826}, {"c": "v", "l": "B2", "q": "\"Therefore\" means:", "o": ["for that reason", "however", "although", "meanwhile"], "j": "therefore = so, as a result.", "fr": "therefore = par conséquent.", "id": 827}, {"c": "v", "l": "B2", "q": "\"Whereas\" is used to show:", "o": ["a contrast", "a reason", "a result", "a time"], "j": "whereas = while (contrast).", "fr": "whereas = tandis que.", "id": 828}, {"c": "v", "l": "B2", "q": "\"Meanwhile\" means:", "o": ["at the same time", "after that", "as a result", "in contrast to"], "j": "meanwhile = during the same period.", "fr": "meanwhile = pendant ce temps.", "id": 829}, {"c": "v", "l": "B2", "q": "A \"bottleneck\" in a project is:", "o": ["a point where work is slowed down", "a type of bottle", "the end of a project", "a bonus"], "j": "bottleneck = obstacle that slows the process.", "fr": "bottleneck = goulet d'étranglement.", "id": 830}, {"c": "v", "l": "B2", "q": "\"Feedback\" is:", "o": ["comments about your work", "food for animals", "a payment", "a complaint form"], "j": "feedback = opinions to help you improve.", "fr": "feedback = retour, avis.", "id": 831}, {"c": "v", "l": "B2", "q": "A \"stakeholder\" is:", "o": ["a person with an interest in a project", "a cook", "a shareholder only", "a customer service agent"], "j": "stakeholder = person affected by or involved in something.", "fr": "stakeholder = partie prenante.", "id": 832}, {"c": "v", "l": "B2", "q": "\"To delegate\" means:", "o": ["give a task to someone else", "do everything yourself", "vote", "argue"], "j": "delegate = assign work to others.", "fr": "delegate = déléguer.", "id": 833}, {"c": "v", "l": "B2", "q": "\"Turnover\" can mean:", "o": ["the total sales of a company", "a fruit cake only", "a tax", "a loss"], "j": "turnover = revenue; also staff leaving rate.", "fr": "turnover = chiffre d'affaires.", "id": 834}], "p": {"1": {"l": "A2", "t": "My Morning", "x": "My name is Sara. I live in Rabat with my parents and my little brother, Adam. Every morning, I get up at half past six. I have a shower and then I eat breakfast with my family. I usually have bread, olive oil and a glass of orange juice. Adam doesn't like breakfast, so he only drinks milk. At quarter past seven, I take the bus to work. I work in a bank in the city centre. The journey takes about thirty minutes. I like my job because my colleagues are friendly."}, "2": {"l": "A2", "t": "A Message to a Friend", "x": "Hi Karim, thanks for your message! I'm sorry, but I can't come to the cinema on Saturday. My grandmother is visiting us this weekend, and my mum wants all the family at home. Are you free on Sunday afternoon? We could go to the new café near the park. They have great cakes and the prices aren't too high. Let me know! Youssef"}, "3": {"l": "A2", "t": "The Library", "x": "The city library opens at 9 a.m. from Monday to Saturday and closes at 6 p.m. On Sundays it is closed. You can borrow up to five books for three weeks. If you return a book late, you pay one dirham for each day. Children under twelve must come with an adult. There is free Wi-Fi, and you can use the computers for one hour per day. Please be quiet in the reading room."}, "4": {"l": "B1", "t": "Working From Home", "x": "More and more people now work from home for at least part of the week. Many workers say they are more productive because there are fewer interruptions and no time is lost travelling. Companies can also save money on office space. However, working from home is not perfect. Some employees feel lonely and miss chatting with their colleagues. Others find it hard to separate their work life from their private life, and they end up working longer hours. Experts suggest creating a dedicated workspace, keeping regular hours and taking short breaks to stay healthy and motivated."}, "5": {"l": "B1", "t": "A Job Advertisement", "x": "GreenWay Travel is looking for a customer service assistant to join our team in Marrakech. You will answer phone calls and emails from customers, help them book trips and solve any problems during their journey. The ideal candidate speaks fluent English and French; Spanish is an advantage. Previous experience in tourism is useful but not essential, as full training will be provided. The position is full-time, Monday to Friday, with one Saturday per month. To apply, send your CV and a short cover letter to jobs@greenway.example before 30 June."}, "6": {"l": "B1", "t": "The Benefits of Sleep", "x": "Scientists agree that sleep is essential for good health. Adults need between seven and nine hours a night, while teenagers need even more. During sleep, the brain organises information from the day, which helps us remember what we have learned. A lack of sleep can make people irritable, reduce their concentration and even weaken the immune system. Surprisingly, many people use their phones in bed, but the blue light from screens can make it harder to fall asleep. Doctors recommend switching off devices at least an hour before bedtime."}, "7": {"l": "B1", "t": "An Email Complaint", "x": "Dear Sir or Madam, I am writing to complain about the headphones I ordered from your website on 3 May (order number 4521). The package arrived a week late, and when I opened it, I found that the left earphone did not work. I contacted your customer service twice by phone, but nobody answered. I would like a full refund or a replacement as soon as possible. I look forward to hearing from you. Yours faithfully, Nadia Benali"}, "8": {"l": "B1", "t": "Plastic in the Ocean", "x": "Every year, millions of tonnes of plastic end up in the oceans. Much of it comes from bottles, bags and packaging that people throw away. Plastic does not disappear; it breaks into very small pieces called microplastics. Fish and birds often eat these pieces, thinking they are food, and they can become ill or die. Microplastics have even been found in the salt and water that humans consume. To reduce the problem, many countries have banned plastic bags, and some supermarkets now encourage customers to bring their own containers."}, "9": {"l": "B2", "t": "The Four-Day Week", "x": "Several companies around the world have experimented with a four-day working week, in which employees work 80% of their usual hours for 100% of their pay. In a large trial in the United Kingdom, most participating firms reported that productivity remained stable or even improved, while staff reported lower levels of stress and burnout. Critics, however, argue that the model may not suit every sector. Hospitals, schools and shops, for instance, need to be open continuously, which would require hiring additional staff. Supporters reply that a well-rested workforce is more efficient and that savings on recruitment, since fewer employees quit, can offset the costs."}, "10": {"l": "B2", "t": "Learning a Language as an Adult", "x": "It is often claimed that children learn languages more easily than adults. While young learners do tend to achieve a more native-like accent, research suggests that adults have several advantages. They can understand grammar rules more quickly, use learning strategies consciously and connect new words to knowledge they already possess. The biggest obstacles for adults are usually not cognitive but practical: lack of time, fear of making mistakes and limited opportunities to speak. Teachers therefore recommend short daily practice sessions, regular conversation with native or fluent speakers, and accepting errors as a natural part of the process."}, "11": {"l": "B2", "t": "Online Reviews", "x": "Before buying a product or booking a hotel, most consumers now read online reviews. These comments can be extremely helpful, but they are not always reliable. Some businesses pay people to write positive reviews, while competitors occasionally post negative ones to damage a rival's reputation. To identify fake reviews, experts advise looking for very general language, a large number of reviews posted on the same day, and reviewers who have written only one comment. Reading a mix of positive and negative opinions, rather than relying on the overall star rating, generally gives a more balanced picture."}, "12": {"l": "A2", "t": "At the Doctor's", "x": "Doctor: Good morning. What's the problem? — Omar: I have a terrible headache and a sore throat. — Doctor: How long have you felt like this? — Omar: Since Tuesday. I also feel very tired. — Doctor: Let me check your temperature… It's 38.5. You have a small fever. I think you have the flu. Drink lots of water, stay in bed for three days and take this medicine twice a day after meals. — Omar: Can I go to work tomorrow? — Doctor: No, you need to rest."}, "13": {"l": "B1", "t": "A Trip to Chefchaouen", "x": "Last spring, my friends and I spent a weekend in Chefchaouen, the famous \"blue city\" in the Rif Mountains. We arrived on Friday evening after a long bus journey from Casablanca. The next morning, we got lost in the narrow streets, but it was the best way to discover the town: every corner was painted in different shades of blue. In the afternoon, we hiked to the Spanish Mosque on a hill to watch the sunset. The view was breathtaking. The only disappointment was the weather on Sunday: it rained all day, so we stayed in a café, drinking mint tea and playing cards."}, "14": {"l": "B2", "t": "Artificial Intelligence at Work", "x": "Artificial intelligence is rapidly changing the workplace. Tools that can write emails, summarise documents and analyse data are now used in many offices. Some workers fear that these technologies will replace them, and it is true that certain repetitive tasks are being automated. However, many economists believe that AI will transform jobs rather than eliminate them entirely. Employees who learn to use these tools effectively may become more productive and focus on tasks that require creativity, empathy and critical thinking, skills that machines still struggle to imitate. The challenge for governments and companies will be to provide training so that no one is left behind."}, "15": {"l": "A2", "t": "Weekend Plans", "x": "Leila loves the weekend. On Saturday morning she goes to the market with her father. They buy fresh fruit, vegetables and fish. In the afternoon, she plays basketball with her team at the sports club. On Sunday, she usually visits her grandparents in a small village near Fes. Her grandmother cooks couscous for the whole family. In the evening, Leila prepares her bag for school and reads a book before going to bed."}, "16": {"l": "B1", "t": "How to Give a Good Presentation", "x": "Giving a presentation can be stressful, but good preparation makes a big difference. First, know your audience: what do they already know, and what do they need from you? Next, organise your ideas into a clear structure with an introduction, two or three main points and a conclusion. Use simple slides with few words and large images; your audience should listen to you, not read a long text. Practise out loud several times, ideally in front of a friend, and time yourself. Finally, remember that it is normal to feel nervous. Breathe slowly, make eye contact and speak a little more slowly than usual."}, "17": {"l": "B2", "t": "The Sharing Economy", "x": "Platforms that allow people to rent out their homes, cars or skills have created what is known as the sharing economy. For consumers, these services often mean lower prices and greater choice. For providers, they offer a flexible way to earn extra income. Nevertheless, the model has provoked controversy. In many cities, short-term holiday rentals have reduced the number of homes available for local residents, pushing up rents. Drivers and delivery workers, meanwhile, are usually classified as self-employed, which means they may lack sick pay, holiday pay and pensions. Several governments are now introducing regulations to address these concerns."}, "18": {"l": "A2", "t": "A Hotel Notice", "x": "Welcome to the Atlas Hotel! Breakfast is served from 7 to 10 a.m. in the restaurant on the ground floor. The swimming pool is open from 9 a.m. to 7 p.m. Towels are available at reception. Please do not take glass bottles to the pool area. Check-out time is 12 noon. If you need a taxi, ask at reception. We hope you enjoy your stay!"}}};</script>
<script>
(function () {
  const CATS = {
    g: { name: "Grammar", desc: "Tenses, conditionals, passive, prepositions", ic: "G" },
    v: { name: "Vocabulary", desc: "Words, phrasal verbs, idioms, false friends", ic: "V" },
    r: { name: "Reading", desc: "Short texts with comprehension questions", ic: "R" },
    c: { name: "Communication", desc: "Polite phrases for work, emails and daily life", ic: "C" },
    d: { name: "Dictation & spelling", desc: "Listen, then pick the correct spelling", ic: "D" }
  };
  const app = document.getElementById('app'), bar = document.getElementById('bar'), homeBtn = document.getElementById('homeBtn');
  const L = 'ABCD';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const store = { get(k, d) { try { const v = localStorage.getItem('en_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
                  set(k, v) { try { localStorage.setItem('en_' + k, JSON.stringify(v)); } catch (e) {} } };
  let hist = store.get('hist', {});          // question id -> 1 right / 0 wrong
  const opt = Object.assign({ lvl: 'all', n: 20, only: 'all' }, store.get('opt', {}));
  let Q = [], P = {}, state = null;
  const canSpeak = 'speechSynthesis' in window;

  function speak(text, rate) {
    if (!canSpeak) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-GB'; u.rate = rate || 0.9;
      const v = speechSynthesis.getVoices().find(v => /^en(-|_)/i.test(v.lang));
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  homeBtn.onclick = home;

  (window.QDATA ? Promise.resolve(window.QDATA) : fetch('questions.json').then(r => r.json()))
    .then(d => { Q = d.q; P = d.p; home(); })
    .catch(() => { app.innerHTML = '<p class="note">Could not load the questions. Please reload the page.</p>'; });

  function pool(cat) {
    let ids = Q.filter(q => (cat === 'all' || q.c === cat) && (opt.lvl === 'all' || q.l === opt.lvl)).map(q => q.id);
    if (opt.only === 'new') ids = ids.filter(id => !(id in hist));
    if (opt.only === 'wrong') ids = ids.filter(id => hist[id] === 0);
    return ids;
  }

  function home() {
    state = null; homeBtn.hidden = true; bar.style.width = '0';
    const done = Object.keys(hist).length, ok = Object.values(hist).filter(v => v === 1).length;
    const seg = (key, vals) => `<div class="seg" data-key="${key}">${vals.map(([v, t]) => `<button type="button" data-v="${v}" aria-pressed="${String(opt[key]) === String(v)}">${t}</button>`).join('')}</div>`;
    const card = (key, name, desc, ic) => {
      const n = pool(key).length;
      return `<button class="cat" data-c="${key}" ${n ? '' : 'disabled style="opacity:.5"'}>
        <span class="ic">${ic}</span>
        <span class="tx"><b>${name}</b><small>${desc}</small></span>
        <span class="sc">${n}</span></button>`;
    };
    app.innerHTML = `
      <section class="hero">
        <div class="eyebrow">Practice · ${Q.length} questions · A2 to B2</div>
        <h1>Improve your English, one question at a time</h1>
        <p class="lede">Pick a topic, tap an answer, and read the explanation. Every answer has a short tip in French.${done ? ` You have answered ${done} questions (${Math.round(100 * ok / done)}% correct).` : ''}</p>
      </section>
      <div class="filters">
        <div><div class="lab">Level</div>${seg('lvl', [['all', 'All'], ['A2', 'A2 · Elementary'], ['B1', 'B1 · Intermediate'], ['B2', 'B2 · Upper-int.']])}</div>
        <div><div class="lab">Questions per quiz</div>${seg('n', [[10, '10'], [20, '20'], [50, '50'], [0, 'All']])}</div>
        <div><div class="lab">Show</div>${seg('only', [['all', 'All questions'], ['new', 'Not answered yet'], ['wrong', 'My mistakes']])}</div>
      </div>
      <div class="cats">
        ${card('all', 'Mixed quiz', 'All topics, random order', '★')}
        ${Object.entries(CATS).map(([k, c]) => card(k, c.name, c.desc, c.ic)).join('')}
      </div>
      <p class="note">${canSpeak ? 'Dictation questions read the word aloud: turn your sound on.' : 'Audio is not available in this browser: dictation questions still work as spelling questions.'} Your progress is saved on this device only.</p>`;
    app.querySelectorAll('.seg').forEach(s => s.onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      const k = s.dataset.key; opt[k] = k === 'n' ? +b.dataset.v : b.dataset.v;
      store.set('opt', opt); home();
    });
    app.querySelectorAll('.cat').forEach(b => b.onclick = () => {
      const k = b.dataset.c;
      let ids = pool(k);
      if (k === 'r') {
        // keep questions of the same text together, texts in random order
        const byP = {}; ids.forEach(id => { const p = Q[id - 1].p; (byP[p] = byP[p] || []).push(id); });
        ids = shuffle(Object.values(byP)).flat();
      } else shuffle(ids);
      if (opt.n) ids = ids.slice(0, opt.n);
      start(ids, k);
    });
  }

  function start(ids, key) {
    state = { key, list: ids.map(id => ({ id, order: shuffle([0, 1, 2, 3]) })), i: 0, ans: {} };
    homeBtn.hidden = false; render();
  }

  function render() {
    const { list, i } = state, it = list[i], q = Q[it.id - 1];
    const picked = state.ans[i], done = picked !== undefined;   // picked = original option index
    const nOk = Object.values(state.ans).filter(v => v === 0).length;
    bar.style.width = (100 * Object.keys(state.ans).length / list.length) + '%';
    const stem = esc(q.q).replace('___', '<span class="blank">&nbsp;</span>');
    const ps = q.p && P[q.p];
    const prevSame = i > 0 && Q[list[i - 1].id - 1].p === q.p;
    app.innerHTML = `
      <div class="qmeta"><span class="tag">${CATS[q.c].name}<span class="lvl" style="color:inherit;border-color:currentColor">${q.l}</span></span><span class="score">${i + 1} / ${list.length} · ✓ ${nOk}</span></div>
      ${ps ? `<details class="passage" ${prevSame ? '' : 'open'}><summary>${esc(ps.t)} (text)</summary><p>${esc(ps.x)}</p></details>` : ''}
      <div class="stem">${stem}</div>
      ${q.say && canSpeak ? `<div class="listen"><button id="play">▶ Listen</button><button id="slow">Slow</button></div>` : ''}
      <div class="opts">
        ${it.order.map((oi, k) => {
          const cls = done ? (oi === 0 ? 'correct' : (oi === picked ? 'wrong' : '')) : '';
          return `<button class="opt ${cls}" data-oi="${oi}" ${done ? 'disabled' : ''}><span class="k">${L[k]}</span><span class="t">${esc(q.o[oi])}</span></button>`;
        }).join('')}
      </div>
      ${done ? `<div class="verdict ${picked === 0 ? 'ok' : 'ko'}" id="verdict">
        <div class="v">${picked === 0 ? 'Correct!' : 'Not quite. The answer is ' + L[it.order.indexOf(0)] + ': ' + esc(q.o[0])}</div>
        <p>${esc(q.j)}</p>
        <p class="fr">${esc(q.fr)}</p>
      </div>` : ''}
      <div class="nav">
        <button class="ghost" id="prev" ${i === 0 ? 'disabled' : ''}>Back</button>
        <button class="primary" id="next">${i === list.length - 1 ? 'See my score' : (done ? 'Next question' : 'Skip')}</button>
      </div>`;
    const play = document.getElementById('play');
    if (play) { play.onclick = () => speak(q.say, 0.9); document.getElementById('slow').onclick = () => speak(q.say, 0.6); }
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const oi = +b.dataset.oi;
      state.ans[i] = oi; hist[q.id] = oi === 0 ? 1 : 0; store.set('hist', hist);
      render();
      if (q.say && q.c === 'd') speak(q.say, 0.9);
      const v = document.getElementById('verdict');
      if (v && v.getBoundingClientRect().bottom > innerHeight) v.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
    document.getElementById('prev').onclick = () => { state.i--; render(); scrollTo(0, 0); };
    document.getElementById('next').onclick = () => { if (i === list.length - 1) return result(); state.i++; render(); scrollTo(0, 0); };
  }

  function result() {
    const { list, ans, key } = state;
    const ok = Object.values(ans).filter(v => v === 0).length;
    const wrong = list.filter((it, k) => ans[k] !== undefined && ans[k] !== 0).map(it => it.id);
    bar.style.width = '100%';
    const pct = Math.round(100 * ok / list.length);
    app.innerHTML = `
      <section class="result">
        <div class="eyebrow">${key === 'all' ? 'Mixed quiz' : CATS[key].name}</div>
        <div class="big">${ok} / ${list.length}</div>
        <p class="lede">${pct >= 80 ? 'Excellent work!' : pct >= 50 ? 'Good job. Review your mistakes and try again.' : 'Keep practising. Every attempt helps.'}</p>
      </section>
      <div class="row">
        <button class="primary" id="again">Back to topics</button>
        ${wrong.length ? `<button class="ghost" id="redo">Retry my ${wrong.length} mistake${wrong.length > 1 ? 's' : ''}</button>` : ''}
      </div>`;
    document.getElementById('again').onclick = home;
    const r = document.getElementById('redo');
    if (r) r.onclick = () => start(shuffle(wrong.slice()), key);
    scrollTo(0, 0);
  }
})();
</script>
<script>(function(){var b=document.querySelector(".brand");if(b){var a=document.createElement("a");a.href="index.html";a.textContent="‹";a.setAttribute("aria-label","Quiz Pro");a.style.cssText="text-decoration:none;color:inherit;margin-inline-end:8px;font-weight:700";b.prepend(a);b.style.cursor="default";}if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){});}})();</script></html>
