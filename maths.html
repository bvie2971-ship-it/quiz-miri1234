<style>
/* Layout: single reading column (max 720px), sticky progress bar, question card + answer panel, RTL */
:root {
  --ink: #15304d;        /* navy of the source booklet */
  --ochre: #a77b2a;      /* gold rule of the booklet */

  --line: #d9e0e8;
  --muted: #5d6b7c;
  --fg: #172331;
  --ok: #1f7a4d; --ok-bg: #e5f4ec;

  --chip: #e8eef5;
  --f-display: "Reem Kufi", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --f-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ink: #9cc0e6; --ochre: #d7ad5c; --paper: #0f1720; --card: #17222e; --line: #2a3a4b;
  --muted: #95a4b5; --fg: #e4ebf2; --ok: #5fcb92; --ok-bg: #143323; --bad: #f08a80; --bad-bg: #3a1c1a; --chip: #1f2e3d;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --ink: #9cc0e6; --ochre: #d7ad5c; --paper: #0f1720; --card: #17222e; --line: #2a3a4b;
  --muted: #95a4b5; --fg: #e4ebf2; --ok: #5fcb92; --ok-bg: #143323; --bad: #f08a80; --bad-bg: #3a1c1a; --chip: #1f2e3d;
  color-scheme: dark }

* { box-sizing: border-box }
html { direction: rtl; }
body { background: var(--paper); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.75; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
.wrap { max-width: 720px; margin: 0 auto; padding-block: 0 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--ochre); outline-offset: 2px; }

/* header */
.top { background: var(--card); border-bottom: 3px solid var(--ochre); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.top .wrap { padding-block: 10px; display: flex; align-items: center; gap: 12px; }
.brand { font-family: var(--f-display); color: var(--ink); font-size: 1.15rem; font-weight: 700; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { background: var(--chip); border: 0; border-radius: 8px; padding: 6px 12px; font-size: .9rem; color: var(--ink); font-weight: 600; }

/* home */
.hero { padding-block: 28px 8px; }
.eyebrow { color: var(--ochre); font-weight: 600; font-size: .9rem; letter-spacing: .02em; }
h1 { font-family: var(--f-display); color: var(--ink); font-size: clamp(1.8rem, 6vw, 2.5rem); line-height: 1.3; margin: 4px 0 8px; text-wrap: balance; }
.lede { color: var(--muted); margin: 0 0 4px; max-width: 60ch; }
.stats { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 6px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; min-width: 0; }
.stat b { display: block; font-size: 1.35rem; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.3; }
.stat span { font-size: .8rem; color: var(--muted); }

.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-top: 18px; display: grid; gap: 14px; }
.panel h2 { font-family: var(--f-display); font-size: 1.15rem; color: var(--ink); margin: 0; }

select, input[type=number] { font: inherit; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--fg); }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }

.check { display: flex; gap: 8px; align-items: center; font-size: .95rem; }

.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 160px; }
.note { font-size: .82rem; color: var(--muted); margin: 0; }

/* quiz */
.progress { height: 4px; background: var(--line); }
.progress i { display: block; height: 100%; background: var(--ochre); width: 0; transition: width .25s; }
.qmeta { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-block: 16px 8px; flex-wrap: wrap; }

.sec { color: var(--muted); font-size: .85rem; flex: 1; min-width: 0; }
.score { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ink); font-size: .95rem; }
.stem { font-size: 1.15rem; font-weight: 600; line-height: 1.8; margin: 4px 0 14px; color: var(--fg); }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: start; background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; width: 100%; transition: border-color .15s, background .15s; }
.opt:hover:not([disabled]) { border-color: var(--ink); }
.opt .k { flex: none; width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; background: var(--chip); color: var(--ink); font-weight: 700; font-family: ui-monospace, Consolas, monospace; font-size: .9rem; margin-top: 2px; }
.opt .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.opt[disabled] { cursor: default; }
.opt.correct { border-color: var(--ok); background: var(--ok-bg); }
.opt.correct .k { background: var(--ok); color: var(--card); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.wrong .k { background: var(--bad); color: var(--card); }
.opt .why { display: block; font-size: .88rem; color: var(--muted); margin-top: 4px; font-weight: 400; }
.opt.correct .why { color: var(--ok); }
.opt.wrong .why { color: var(--bad); }

.verdict { margin-top: 16px; border-radius: 10px; padding: 14px 16px; border: 1px solid var(--line); background: var(--card); }
.verdict .v { font-weight: 700; font-size: 1.05rem; }
.verdict.ok .v { color: var(--ok); } .verdict.ko .v { color: var(--bad); }
.verdict h3 { font-size: .9rem; color: var(--ochre); margin: 10px 0 2px; font-weight: 700; }
.verdict p { margin: 0; }
.ref { font-size: .82rem; color: var(--muted); margin-top: 10px !important; border-top: 1px dashed var(--line); padding-top: 8px; }
.nav { display: flex; gap: 10px; margin-top: 18px; }
.nav .primary { flex: 2; } .nav .ghost { flex: 1; }

/* result */
.result { text-align: center; padding-block: 32px 8px; }
.big { font-family: var(--f-display); font-size: 3.4rem; color: var(--ink); line-height: 1.1; font-variant-numeric: tabular-nums; }
.wronglist { display: grid; gap: 8px; margin-top: 12px; }
.wronglist button { text-align: start; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: .92rem; display: flex; gap: 10px; }
.wronglist button .qid { flex: none; align-self: flex-start; }
.wronglist button span:last-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.loading { padding: 40px 0; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>

<script>
(function () {
  document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl';
  const app = document.getElementById('app');
  const bar = document.getElementById('bar');
  const homeBtn = document.getElementById('homeBtn');
  const L = 'ABCDE';
  let Q = [], sections = [], state = null;
  const store = {
    get(k, d) { try { const v = localStorage.getItem('qz_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('qz_' + k, JSON.stringify(v)); } catch (e) {} }
  };
  let hist = store.get('hist', {});   // id -> 1 correct / 0 wrong (last attempt)
  const opts = Object.assign({ sec: 'all', n: 20, order: 'random', only: 'all' }, store.get('opts', {}));

  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // keep math runs (a+b)² = a²+2ab+b² left-to-right inside Arabic text
  const MATH = /([A-Za-z√(|\-][A-Za-z0-9√()+\-=×/²³|<>≥≤^ .]*[A-Za-z0-9)²³|])/g;
  const fmt = s => String(s == null ? '' : s).split(MATH).map((p, i) => i % 2 ? '<bdi dir="ltr">' + esc(p) + '</bdi>' : esc(p)).join('');
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  function load() {

    return fetch('questions.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  }

    Q = data;

    sections = [...seen.entries()];
    route();
  }).catch(() => {
    app.innerHTML = '<div class="loading">تعذّر تحميل ملف الأسئلة. أعد تحميل الصفحة.</div>';
  });

  window.addEventListener('hashchange', route);
  homeBtn.addEventListener('click', () => { location.hash = ''; renderHome(); });

  function route() {
    const m = /^#(Q\d{3})$/.exec(location.hash);

      const i = Q.findIndex(q => q.id === m[1]);
      if (i >= 0) { startWith([i], 'سؤال ' + m[1]); return; }
    }
    renderHome();
  }

  function counts() {
    const ids = Object.keys(hist);
    const ok = ids.filter(k => hist[k] === 1).length;
    return { done: ids.length, ok, ko: ids.length - ok };
  }

  function renderHome() {
    state = null; homeBtn.hidden = true; bar.style.width = '0';
    const c = counts();
    app.innerHTML = `
      <section class="hero">
        <div class="eyebrow">التعليم الثانوي الإعدادي · مادة الرياضيات</div>

        <div class="stats">
          <div class="stat"><b>${c.done}</b><span>سؤال أُجيب عنه</span></div>
          <div class="stat"><b>${c.done ? Math.round(100 * c.ok / c.done) : 0}%</b><span>نسبة النجاح</span></div>
          <div class="stat"><b>${c.ko}</b><span>خطأ للمراجعة</span></div>
        </div>
      </section>

        </label>
        <div class="fld">عدد الأسئلة
          <div class="seg" id="nSeg">
            ${[10, 20, 50, 0].map(n => `<button type="button" data-n="${n}" aria-pressed="${opts.n === n}">${n || 'الكل'}</button>`).join('')}
          </div>
        </div>
        <div class="fld">الترتيب
          <div class="seg" id="oSeg">
            <button type="button" data-o="random" aria-pressed="${opts.order === 'random'}">عشوائي</button>
            <button type="button" data-o="seq" aria-pressed="${opts.order === 'seq'}">حسب الترقيم</button>
          </div>
        </div>
        <div class="fld">الأسئلة
          <div class="seg" id="fSeg">
            <button type="button" data-f="all" aria-pressed="${opts.only === 'all'}">الكل</button>
            <button type="button" data-f="new" aria-pressed="${opts.only === 'new'}">لم أجب عنها بعد</button>
            <button type="button" data-f="wrong" aria-pressed="${opts.only === 'wrong'}">أخطائي فقط</button>
          </div>
        </div>
        <button class="primary" id="go">ابدأ الاختبار</button>
      </section>

      <section class="panel" aria-labelledby="h-jump">
        <h2 id="h-jump">الانتقال إلى سؤال محدد</h2>
        <div class="row">
          <input type="number" id="jump" min="1" max="${Q.length}" placeholder="رقم السؤال (1 – ${Q.length})" inputmode="numeric">
          <button class="ghost" id="jumpGo">عرض السؤال</button>
        </div>
        <div class="row">
          <button class="ghost" id="reset">مسح سجل الإجابات</button>
        </div>
        <p class="note" id="resetNote">يُحفظ تقدمك على هذا الجهاز فقط.</p>
      </section>
      <p class="note" style="margin-top:18px">المصدر: بنك أسئلة الامتحان المهني، رقم 2، الطبعة الشاملة الموسعة (696 سؤالاً). التصحيح اجتهاد تدريبي مستند إلى الوثائق الرسمية وليس وثيقة رسمية.</p>
    `;
    const sec = document.getElementById('sec');
    sec.value = opts.sec;
    const seg = (id, attr, key, cast) => document.getElementById(id).addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      opts[key] = cast(b.dataset[attr]);
      [...e.currentTarget.children].forEach(x => x.setAttribute('aria-pressed', x === b));
    });
    seg('nSeg', 'n', 'n', Number); seg('oSeg', 'o', 'order', String); seg('fSeg', 'f', 'only', String);
    document.getElementById('go').onclick = () => {
      opts.sec = sec.value; store.set('opts', opts);
      let pool = Q.map((q, i) => i).filter(i => opts.sec === 'all' || Q[i].s === sections[+opts.sec][0]);
      if (opts.only === 'new') pool = pool.filter(i => !(Q[i].id in hist));
      if (opts.only === 'wrong') pool = pool.filter(i => hist[Q[i].id] === 0);
      if (!pool.length) { document.getElementById('go').textContent = 'لا توجد أسئلة بهذه الاختيارات'; setTimeout(() => { const g = document.getElementById('go'); if (g) g.textContent = 'ابدأ الاختبار'; }, 1800); return; }
      if (opts.order === 'random') shuffle(pool);
      if (opts.n) pool = pool.slice(0, opts.n);
      startWith(pool, opts.sec === 'all' ? 'كل المحاور' : sections[+opts.sec][0]);
    };
    const jump = () => {
      const n = parseInt(document.getElementById('jump').value, 10);
      if (n >= 1 && n <= Q.length) location.hash = 'Q' + String(n).padStart(3, '0');
    };
    document.getElementById('jumpGo').onclick = jump;
    document.getElementById('jump').addEventListener('keydown', e => { if (e.key === 'Enter') jump(); });
    const rb = document.getElementById('reset');
    rb.onclick = () => {
      if (rb.dataset.armed) { hist = {}; store.set('hist', hist); renderHome(); return; }
      rb.dataset.armed = '1'; rb.textContent = 'اضغط مرة أخرى لتأكيد المسح';
    };
  }

  function startWith(list, label) {
    state = { list, label, i: 0, ans: {} };
    homeBtn.hidden = false;
    renderQ();
  }

  function renderQ() {
    const { list, i } = state;
    const q = Q[list[i]];
    const picked = state.ans[i];
    const done = picked !== undefined;
    const nOk = Object.entries(state.ans).filter(([k, v]) => v === Q[list[k]].a).length;
    bar.style.width = (100 * Object.keys(state.ans).length / list.length) + '%';
    app.innerHTML = `
      <div class="qmeta">
        <span class="qid">${q.id}</span>
        <span class="sec">${esc(q.s)}</span>
        <span class="score">${i + 1} / ${list.length} · ✓ ${nOk}</span>
      </div>
      <div class="stem">${fmt(q.q)}</div>
      <div class="opts" role="list">
        ${q.o.map((o, k) => {
          let cls = '';
          if (done) cls = k === q.a ? 'correct' : (k === picked ? 'wrong' : '');
          const why = done && q.d[k] ? `<span class="why">${fmt(q.d[k])}</span>` : '';
          return `<button class="opt ${cls}" data-k="${k}" ${done ? 'disabled' : ''} role="listitem"><span class="k">${L[k]}</span><span class="t">${fmt(o)}${why}</span></button>`;
        }).join('')}
      </div>
      ${done ? `
      <div class="verdict ${picked === q.a ? 'ok' : 'ko'}" id="verdict">
        <div class="v">${picked === q.a ? 'إجابة صحيحة' : 'إجابة خاطئة · الجواب الصحيح: ' + L[q.a]}</div>
        <h3>تعليل الإجابة الصحيحة</h3>
        <p>${fmt(q.j)}</p>
        ${q.r ? `<p class="ref">المرجع: ${esc(q.r)}</p>` : ''}
      </div>` : ''}
      <div class="nav">
        <button class="ghost" id="prev" ${i === 0 ? 'disabled' : ''}>السابق</button>
        <button class="primary" id="next">${i === list.length - 1 ? 'النتيجة' : (done ? 'السؤال التالي' : 'تخطَّ')}</button>
      </div>
    `;
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const k = +b.dataset.k;
      state.ans[i] = k;
      hist[q.id] = k === q.a ? 1 : 0; store.set('hist', hist);
      renderQ();
      const v = document.getElementById('verdict');
      if (v && v.getBoundingClientRect().top > innerHeight - 80) v.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
    document.getElementById('prev').onclick = () => { state.i--; renderQ(); scrollTo(0, 0); };
    document.getElementById('next').onclick = () => {
      if (i === list.length - 1) return renderResult();
      state.i++; renderQ(); scrollTo(0, 0);
    };
  }

  function renderResult() {
    const { list, ans } = state;
    const answered = Object.keys(ans).length;
    const ok = Object.entries(ans).filter(([k, v]) => v === Q[list[k]].a).length;
    const wrong = Object.entries(ans).filter(([k, v]) => v !== Q[list[k]].a).map(([k]) => +k);
    bar.style.width = '100%';
    app.innerHTML = `
      <section class="result">
        <div class="eyebrow">${esc(state.label)}</div>
        <div class="big">${ok} / ${list.length}</div>
        <p class="lede" style="margin:8px auto">${answered < list.length ? (list.length - answered) + ' سؤال بدون جواب · ' : ''}نسبة النجاح ${answered ? Math.round(100 * ok / answered) : 0}%</p>
      </section>
      <div class="row">
        <button class="primary" id="again">اختبار جديد</button>
        ${wrong.length ? '<button class="ghost" id="redo">إعادة الأسئلة الخاطئة</button>' : ''}
      </div>
      ${wrong.length ? `<section class="panel"><h2>الأسئلة الخاطئة</h2><div class="wronglist">
        ${wrong.map(k => `<button data-k="${k}"><span class="qid">${Q[list[k]].id}</span><span>${esc(Q[list[k]].q)}</span></button>`).join('')}
      </div></section>` : ''}
    `;
    document.getElementById('again').onclick = () => { location.hash = ''; renderHome(); };
    const redo = document.getElementById('redo');
    if (redo) redo.onclick = () => startWith(wrong.map(k => list[k]), 'مراجعة الأخطاء');
    app.querySelectorAll('.wronglist button').forEach(b => b.onclick = () => { state.i = +b.dataset.k; renderQ(); scrollTo(0, 0); });
    scrollTo(0, 0);
  }
})();
</script>
